<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- 定义样式 -->
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .core-box { fill: #ff9999; stroke: #cc0000; stroke-width: 2; }
      .ui-box { fill: #99ccff; stroke: #0066cc; stroke-width: 2; }
      .tool-box { fill: #ffcc99; stroke: #ff6600; stroke-width: 2; }
      .cloud-box { fill: #ffccff; stroke: #cc00cc; stroke-width: 2; }
      .db-box { fill: #99ff99; stroke: #00cc00; stroke-width: 2; }
      .text { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-size: 16px; font-weight: bold; }
      .small { font-size: 12px; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="600" y="30" class="text title">UniBase 架构总览图</text>

  <!-- Core 库群组 -->
  <g id="core-section">
    <rect x="50" y="80" width="380" height="320" fill="#ffe6e6" stroke="#ff9999" stroke-width="2" rx="5"/>
    <text x="240" y="105" class="text title">Core 库（无 UI 依赖）</text>
    
    <!-- 核心管理器 -->
    <rect x="80" y="130" width="320" height="50" class="core-box" rx="5"/>
    <text x="240" y="165" class="text title">TUniBaseManager</text>
    
    <!-- 子模块网格 -->
    <g id="modules">
      <!-- 第一行 -->
      <rect x="80" y="200" width="70" height="40" class="box" rx="3"/>
      <text x="115" y="225" class="text small">Config</text>
      
      <rect x="160" y="200" width="70" height="40" class="box" rx="3"/>
      <text x="195" y="225" class="text small">i18n</text>
      
      <rect x="240" y="200" width="70" height="40" class="box" rx="3"/>
      <text x="275" y="225" class="text small">Logging</text>
      
      <rect x="320" y="200" width="80" height="40" class="box" rx="3"/>
      <text x="360" y="225" class="text small">MRU</text>
      
      <!-- 第二行 -->
      <rect x="80" y="255" width="70" height="40" class="box" rx="3"/>
      <text x="115" y="280" class="text small">Hotkeys</text>
      
      <rect x="160" y="255" width="70" height="40" class="box" rx="3"/>
      <text x="195" y="280" class="text small">Theme</text>
      
      <rect x="240" y="255" width="70" height="40" class="box" rx="3"/>
      <text x="275" y="280" class="text small">Exception</text>
      
      <rect x="320" y="255" width="80" height="40" class="box" rx="3"/>
      <text x="360" y="280" class="text small">LLM</text>
      
      <!-- 第三行 -->
      <rect x="80" y="310" width="150" height="40" class="box" rx="3"/>
      <text x="155" y="335" class="text small">AutoUpdate</text>
      
      <rect x="240" y="310" width="160" height="40" class="box" rx="3"/>
      <text x="320" y="335" class="text small">RemoteConfig</text>
    </g>
    
    <!-- 箭头从管理器到模块 -->
    <line x1="240" y1="180" x2="115" y2="200" class="arrow" stroke-width="1"/>
    <line x1="240" y1="180" x2="195" y2="200" class="arrow" stroke-width="1"/>
    <line x1="240" y1="180" x2="275" y2="200" class="arrow" stroke-width="1"/>
    <line x1="240" y1="180" x2="360" y2="200" class="arrow" stroke-width="1"/>
  </g>

  <!-- UI 控件群组 -->
  <g id="ui-section">
    <rect x="480" y="80" width="220" height="320" fill="#e6f2ff" stroke="#99ccff" stroke-width="2" rx="5"/>
    <text x="590" y="105" class="text title">UI 控件包</text>
    
    <!-- VCL -->
    <rect x="500" y="130" width="90" height="40" class="ui-box" rx="3"/>
    <text x="545" y="150" class="text small">VCL</text>
    <text x="545" y="165" class="text small" font-size="11">15 控件</text>
    
    <!-- FMX -->
    <rect x="600" y="130" width="90" height="40" class="ui-box" rx="3"/>
    <text x="645" y="150" class="text small">FMX</text>
    <text x="645" y="165" class="text small" font-size="11">15 控件</text>
    
    <!-- 控件分类 -->
    <text x="590" y="200" class="text small" font-weight="bold">MRU 控件</text>
    <text x="590" y="220" class="text small">• TMRUPopupMenu</text>
    <text x="590" y="235" class="text small">• TMRUComboBox</text>
    
    <text x="590" y="260" class="text small" font-weight="bold">i18n 控件</text>
    <text x="590" y="280" class="text small">• TI18nLabel</text>
    <text x="590" y="295" class="text small">• TI18nButton</text>
    
    <text x="590" y="320" class="text small" font-weight="bold">Config 控件</text>
    <text x="590" y="340" class="text small">• TConfigEdit</text>
    <text x="590" y="355" class="text small">• TConfigCheckBox</text>
  </g>

  <!-- 工具群组 -->
  <g id="tool-section">
    <rect x="750" y="80" width="200" height="320" fill="#fff9e6" stroke="#ffcc99" stroke-width="2" rx="5"/>
    <text x="850" y="105" class="text title">工具集</text>
    
    <!-- Studio -->
    <rect x="770" y="130" width="160" height="50" class="tool-box" rx="3"/>
    <text x="850" y="150" class="text small">UniBase Studio</text>
    <text x="850" y="170" class="text small">管理工具</text>
    
    <!-- 功能列表 -->
    <text x="850" y="200" class="text small">✓ 项目管理</text>
    <text x="850" y="220" class="text small">✓ i18n 翻译</text>
    <text x="850" y="240" class="text small">✓ 日志查看</text>
    <text x="850" y="260" class="text small">✓ 异常分析</text>
    <text x="850" y="280" class="text small">✓ 资源管理</text>
    <text x="850" y="300" class="text small">✓ LLM 管理</text>
    <text x="850" y="320" class="text small">✓ 版本发布</text>
    
    <!-- CLI -->
    <rect x="770" y="345" width="160" height="45" class="tool-box" rx="3"/>
    <text x="850" y="362" class="text small">UniBase CLI</text>
    <text x="850" y="380" class="text small">命令行工具</text>
  </g>

  <!-- 云端服务群组 -->
  <g id="cloud-section">
    <rect x="1000" y="80" width="170" height="320" fill="#f9e6ff" stroke="#ffccff" stroke-width="2" rx="5"/>
    <text x="1085" y="105" class="text title">云端服务</text>
    <text x="1085" y="125" class="text small">(可选)</text>
    
    <rect x="1020" y="145" width="130" height="50" class="cloud-box" rx="3"/>
    <text x="1085" y="165" class="text small">版本更新</text>
    <text x="1085" y="180" class="text small">服务</text>
    
    <rect x="1020" y="210" width="130" height="50" class="cloud-box" rx="3"/>
    <text x="1085" y="230" class="text small">远程配置</text>
    <text x="1085" y="245" class="text small">服务</text>
    
    <rect x="1020" y="275" width="130" height="50" class="cloud-box" rx="3"/>
    <text x="1085" y="295" class="text small">反馈收集</text>
    <text x="1085" y="310" class="text small">服务</text>
  </g>

  <!-- 数据库 -->
  <g id="database">
    <rect x="480" y="440" width="180" height="60" class="db-box" rx="5"/>
    <text x="570" y="460" class="text title">SQLite</text>
    <text x="570" y="480" class="text title">config.db</text>
    <text x="570" y="500" class="text small">(Tier 0/1/2 表)</text>
  </g>

  <!-- Image32 库 -->
  <g id="image32">
    <rect x="750" y="440" width="180" height="60" class="db-box" rx="5"/>
    <text x="840" y="460" class="text title">Image32</text>
    <text x="840" y="480" class="text title">SVG 库</text>
    <text x="840" y="500" class="text small">(VCL + FMX)</text>
  </g>

  <!-- 应用程序 -->
  <g id="application">
    <rect x="150" y="440" width="200" height="60" class="core-box" rx="5"/>
    <text x="250" y="465" class="text title">应用程序</text>
    <text x="250" y="485" class="text small">(VCL / FMX 桌面应用)</text>
  </g>

  <!-- 连接线 -->
  <g id="connections" stroke-width="2">
    <!-- 应用 到 Core -->
    <line x1="250" y1="500" x2="240" y2="400" class="arrow"/>
    <text x="260" y="450" class="text small">使用</text>
    
    <!-- Core 到 数据库 -->
    <line x1="240" y1="400" x2="570" y2="440" class="arrow"/>
    <text x="390" y="420" class="text small">读/写</text>
    
    <!-- UI 到 Image32 -->
    <line x1="590" y1="400" x2="840" y2="440" class="arrow"/>
    <text x="700" y="420" class="text small">使用</text>
    
    <!-- Core 到 UI -->
    <line x1="430" y1="240" x2="480" y2="240" class="arrow"/>
    <text x="455" y="235" class="text small">依赖</text>
    
    <!-- Core 到 工具 -->
    <line x1="430" y1="250" x2="750" y2="250" class="arrow"/>
    
    <!-- Core 到 云端 -->
    <line x1="430" y1="260" x2="1000" y2="260" class="arrow"/>
    
    <!-- 工具 到 数据库 -->
    <line x1="850" y1="400" x2="660" y2="440" class="arrow"/>
  </g>

  <!-- Tier 分层图 -->
  <g id="tier-diagram">
    <text x="100" y="600" class="text title">表分层结构</text>
    
    <!-- Tier 0 -->
    <rect x="50" y="620" width="140" height="120" fill="#ffcccc" stroke="#cc0000" stroke-width="2" rx="3"/>
    <text x="120" y="640" class="text small" font-weight="bold">Tier 0（必选）</text>
    <text x="120" y="660" class="text small">SchemaInfo</text>
    <text x="120" y="675" class="text small">ProjectInfo</text>
    <text x="120" y="690" class="text small">Settings</text>
    <text x="120" y="705" class="text small">FormStates</text>
    <text x="120" y="720" class="text small">Languages</text>
    <text x="120" y="735" class="text small">I18nTexts</text>
    
    <!-- Tier 1 -->
    <rect x="250" y="620" width="140" height="120" fill="#ffffcc" stroke="#ffcc00" stroke-width="2" rx="3"/>
    <text x="320" y="640" class="text small" font-weight="bold">Tier 1（推荐）</text>
    <text x="320" y="660" class="text small">Logs</text>
    <text x="320" y="675" class="text small">MRU</text>
    <text x="320" y="690" class="text small">Hotkeys</text>
    <text x="320" y="705" class="text small">Themes</text>
    <text x="320" y="720" class="text small"></text>
    <text x="320" y="735" class="text small"></text>
    
    <!-- Tier 2 -->
    <rect x="450" y="620" width="140" height="120" fill="#ccffcc" stroke="#00cc00" stroke-width="2" rx="3"/>
    <text x="520" y="640" class="text small" font-weight="bold">Tier 2（可选）</text>
    <text x="520" y="660" class="text small">ExceptionReports</text>
    <text x="520" y="675" class="text small">LLMCalls</text>
    <text x="520" y="690" class="text small">AnimationAssets</text>
    <text x="520" y="705" class="text small">UsageStats</text>
    <text x="520" y="720" class="text small">UserFeedback</text>
    <text x="520" y="735" class="text small">TestSnapshots</text>
  </g>

  <!-- 模块依赖 -->
  <g id="module-dependencies">
    <text x="800" y="600" class="text title">模块依赖关系</text>
    
    <rect x="750" y="620" width="400" height="240" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    
    <!-- 中心的 TUniBaseManager -->
    <circle cx="950" cy="700" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
    <text x="950" y="705" class="text small" font-weight="bold">Manager</text>
    
    <!-- 周围的模块 -->
    <circle cx="800" cy="640" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="800" y="650" class="text small" font-size="10">Config</text>
    
    <circle cx="900" cy="630" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="900" y="640" class="text small" font-size="10">i18n</text>
    
    <circle cx="1000" cy="630" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="1000" y="640" class="text small" font-size="10">Logging</text>
    
    <circle cx="1100" cy="640" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="1100" y="650" class="text small" font-size="10">MRU</text>
    
    <circle cx="800" cy="760" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="800" y="770" class="text small" font-size="10">Hotkeys</text>
    
    <circle cx="900" cy="770" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="900" y="780" class="text small" font-size="10">Theme</text>
    
    <circle cx="1000" cy="770" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="1000" y="780" class="text small" font-size="10">LLM</text>
    
    <circle cx="1100" cy="760" r="20" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
    <text x="1100" y="770" class="text small" font-size="10">Update</text>
    
    <!-- 连接线 -->
    <line x1="820" y1="660" x2="920" y2="685" stroke="#999" stroke-width="1"/>
    <line x1="920" y1="650" x2="920" y2="685" stroke="#999" stroke-width="1"/>
    <line x1="1000" y1="650" x2="950" y2="685" stroke="#999" stroke-width="1"/>
    <line x1="1080" y1="660" x2="980" y2="685" stroke="#999" stroke-width="1"/>
    <line x1="820" y1="740" x2="920" y2="715" stroke="#999" stroke-width="1"/>
    <line x1="920" y1="750" x2="920" y2="715" stroke="#999" stroke-width="1"/>
    <line x1="1000" y1="750" x2="950" y2="715" stroke="#999" stroke-width="1"/>
    <line x1="1080" y1="740" x2="980" y2="715" stroke="#999" stroke-width="1"/>
  </g>

  <!-- 图例 -->
  <g id="legend">
    <text x="50" y="870" class="text small" font-weight="bold">图例：</text>
    <rect x="150" y="855" width="15" height="15" fill="#ff9999" stroke="#333" stroke-width="1"/>
    <text x="175" y="865" class="text small">Core 库</text>
    
    <rect x="280" y="855" width="15" height="15" fill="#99ccff" stroke="#333" stroke-width="1"/>
    <text x="305" y="865" class="text small">UI 控件</text>
    
    <rect x="410" y="855" width="15" height="15" fill="#ffcc99" stroke="#333" stroke-width="1"/>
    <text x="435" y="865" class="text small">工具</text>
    
    <rect x="490" y="855" width="15" height="15" fill="#ffccff" stroke="#333" stroke-width="1"/>
    <text x="515" y="865" class="text small">云端服务</text>
    
    <rect x="670" y="855" width="15" height="15" fill="#99ff99" stroke="#333" stroke-width="1"/>
    <text x="695" y="865" class="text small">数据/库</text>
  </g>
</svg>
