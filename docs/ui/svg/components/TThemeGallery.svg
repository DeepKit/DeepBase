<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .icon { fill: #666; }
      .highlight { fill: #ffeb3b; fill-opacity: 0.3; }
      .tag { fill: #e0e0e0; font-size: 9px; }
    </style>
  </defs>
  <rect width="400" height="250" class="bg" />
  
          <text x="10" y="20" class="title">TThemeGallery</text>
          
          <rect x="10" y="30" width="380" height="210" class="ctrl-bg" />
          
          <!-- Grid Layout -->
          <!-- Item 1 -->
          <g transform="translate(20, 40)">
            <rect width="100" height="80" fill="#fff" stroke="#ccc" />
            <rect x="5" y="5" width="90" height="50" fill="#f0f0f0" /> <!-- Preview -->
            <text x="50" y="75" class="label" text-anchor="middle">Light</text>
          </g>
          
          <!-- Item 2 -->
          <g transform="translate(140, 40)">
            <rect width="100" height="80" fill="#333" stroke="#000" />
            <rect x="5" y="5" width="90" height="50" fill="#444" /> <!-- Preview -->
            <text x="50" y="75" class="label" text-anchor="middle" fill="#fff">Dark</text>
            <circle cx="90" cy="70" r="8" fill="#4caf50" /> <!-- Active Check -->
            <path d="M86 70 l2 2 l4 -4" fill="none" stroke="#fff" stroke-width="1.5" />
          </g>
          
          <!-- Item 3 -->
          <g transform="translate(260, 40)">
            <rect width="100" height="80" fill="#e3f2fd" stroke="#2196f3" />
            <rect x="5" y="5" width="90" height="50" fill="#bbdefb" /> <!-- Preview -->
            <text x="50" y="75" class="label" text-anchor="middle">Blue</text>
          </g>
          
          <!-- Item 4 -->
          <g transform="translate(20, 140)">
             <rect width="100" height="80" fill="#fbe9e7" stroke="#ff5722" />
             <text x="50" y="50" class="label" text-anchor="middle" fill="#aaa">(Preview)</text>
             <text x="50" y="75" class="label" text-anchor="middle">Orange</text>
          </g>
        
</svg>