<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .icon { fill: #666; }
      .highlight { fill: #ffeb3b; fill-opacity: 0.3; }
      .tag { fill: #e0e0e0; font-size: 9px; }
    </style>
  </defs>
  <rect width="300" height="120" class="bg" />
  
          <text x="10" y="20" class="title">TMRUComboBox</text>
          
          <text x="10" y="40" class="label">Search:</text>
          
          <!-- ComboBox -->
          <rect x="60" y="25" width="200" height="25" class="ctrl-bg" />
          <text x="70" y="42" class="label">UniBase Specs</text>
          <path d="M240 35 l5 5 l5 -5" fill="none" stroke="#666" />
          
          <!-- Dropdown -->
          <g transform="translate(60, 50)">
            <rect width="200" height="60" fill="#fff" stroke="#999" stroke-width="1" />
            <text x="10" y="17" class="label" fill="#999">🕒 UniBase Specs</text>
            <line x1="0" y1="20" x2="200" y2="20" stroke="#eee" />
            <text x="10" y="37" class="label" fill="#999">🕒 Project Architecture</text>
            <line x1="0" y1="40" x2="200" y2="40" stroke="#eee" />
            <text x="10" y="57" class="label" fill="#999">🕒 Database Schema</text>
          </g>
        
</svg>