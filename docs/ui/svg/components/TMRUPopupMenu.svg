<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 200" width="250" height="200">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .icon { fill: #666; }
      .highlight { fill: #ffeb3b; fill-opacity: 0.3; }
      .tag { fill: #e0e0e0; font-size: 9px; }
    </style>
  </defs>
  <rect width="250" height="200" class="bg" />
  
          <text x="10" y="20" class="title">TMRUPopupMenu</text>
          
          <!-- Menu Bar Item -->
          <rect x="10" y="30" width="60" height="25" fill="#eee" stroke="#ccc" />
          <text x="20" y="47" class="label">File</text>
          
          <!-- Popup Menu -->
          <g transform="translate(10, 55)">
            <rect width="200" height="135" fill="#fff" stroke="#999" stroke-width="1" filter="drop-shadow(2px 2px 2px rgba(0,0,0,0.2))"/>
            
            <text x="20" y="20" class="label">Open...</text>
            <text x="20" y="40" class="label">Save</text>
            <line x1="0" y1="50" x2="200" y2="50" stroke="#ccc" />
            
            <!-- MRU Items -->
            <text x="20" y="70" class="label" font-weight="bold">Recent Files ▶</text>
            
            <!-- Sub Menu -->
            <g transform="translate(195, 50)">
               <rect width="180" height="100" fill="#fff" stroke="#999" stroke-width="1" />
               <text x="10" y="20" class="label">1. config.db</text>
               <text x="10" y="40" class="label">2. root.txt</text>
               <text x="10" y="60" class="label">3. main.pas</text>
               <line x1="0" y1="70" x2="180" y2="70" stroke="#eee" />
               <text x="10" y="90" class="label" fill="#d32f2f">Clear History</text>
            </g>
          </g>
        
</svg>