<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #f0f0f0; }
      .window-bg { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .titlebar { fill: #4a90d9; }
      .titlebar-text { font-family: Microsoft YaHei, Arial; font-size: 14px; fill: white; font-weight: bold; }
      .panel { fill: #fafafa; stroke: #ddd; stroke-width: 1; }
      .panel-header { fill: #e8e8e8; stroke: #ccc; stroke-width: 1; }
      .label { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: #333; }
      .label-bold { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: #333; font-weight: bold; }
      .text { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #666; }
      .text-small { font-family: Microsoft YaHei, Arial; font-size: 10px; fill: #888; }
      .input { fill: #ffffff; stroke: #ccc; stroke-width: 1; }
      .input-focus { fill: #ffffff; stroke: #4a90d9; stroke-width: 2; }
      .button { fill: #4a90d9; stroke: #3a7bc8; stroke-width: 1; rx: 4; }
      .button-text { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: white; font-weight: bold; }
      .button-secondary { fill: #e0e0e0; stroke: #bbb; stroke-width: 1; }
      .button-secondary-text { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #333; }
      .tree-item { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #333; }
      .tree-item-selected { fill: #e3f2fd; }
      .list-item { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #333; }
      .list-item-selected { fill: #bbdefb; }
      .grid-header { fill: #f5f5f5; stroke: #ddd; stroke-width: 1; }
      .grid-cell { fill: #fff; stroke: #eee; stroke-width: 1; }
      .version-active { fill: #4caf50; }
      .version-inactive { fill: #e0e0e0; }
      .response-area { fill: #f9f9f9; stroke: #ddd; stroke-width: 1; }
      .splitter { fill: #e0e0e0; stroke: #ccc; stroke-width: 1; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" class="bg"/>

  <!-- 主窗口 -->
  <rect x="20" y="20" width="1160" height="760" class="window-bg" rx="5"/>

  <!-- 标题栏 -->
  <rect x="20" y="20" width="1160" height="35" class="titlebar" rx="5"/>
  <rect x="20" y="40" width="1160" height="15" class="titlebar"/>
  <text x="40" y="43" class="titlebar-text">📝 LLM 提示词调试</text>
  <text x="1130" y="43" class="titlebar-text" style="font-size:16px">×</text>
  <text x="1100" y="43" class="titlebar-text" style="font-size:12px">□</text>
  <text x="1070" y="43" class="titlebar-text" style="font-size:12px">—</text>

  <!-- ===== 左侧面板 (280px) ===== -->
  <g id="left-panel">
    <!-- 分类树区域 -->
    <rect x="30" y="65" width="260" height="320" class="panel" rx="3"/>
    <rect x="30" y="65" width="260" height="25" class="panel-header" rx="3"/>
    <text x="45" y="82" class="label-bold">📁 提示词分类 (4级)</text>

    <!-- 树形结构 -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" class="tree-item">▼ 📂 01-系统提示词</text>
      <text x="15" y="18" class="tree-item">  ▼ 📂 01-通用</text>
      <text x="30" y="36" class="tree-item">    ▶ 📂 01-问答</text>
      <text x="30" y="54" class="tree-item">    ▶ 📂 02-摘要</text>
      <text x="15" y="72" class="tree-item">  ▶ 📂 02-安全</text>
      <text x="0" y="90" class="tree-item">▼ 📂 02-业务提示词</text>
      <rect x="10" y="96" width="220" height="18" class="tree-item-selected" rx="2"/>
      <text x="15" y="110" class="tree-item" font-weight="bold">  ▼ 📂 01-客户管理</text>
      <text x="30" y="128" class="tree-item">    ▶ 📂 01-分析</text>
      <text x="30" y="146" class="tree-item">    ▶ 📂 02-画像</text>
      <text x="15" y="164" class="tree-item">  ▶ 📂 02-订单管理</text>
      <text x="0" y="182" class="tree-item">▶ 📂 03-报表提示词</text>
      <text x="0" y="200" class="tree-item">▶ 📂 04-工具提示词</text>
    </g>

    <!-- 分隔条 -->
    <rect x="30" y="390" width="260" height="6" class="splitter" rx="2"/>
    <line x1="150" y1="393" x2="170" y2="393" stroke="#999" stroke-width="2"/>

    <!-- 提示词列表区域 -->
    <rect x="30" y="400" width="260" height="330" class="panel" rx="3"/>
    <rect x="30" y="400" width="260" height="25" class="panel-header" rx="3"/>
    <text x="45" y="417" class="label-bold">📋 提示词列表 (02-01-客户管理)</text>

    <!-- 列表内容 -->
    <g transform="translate(40, 435)">
      <rect x="-5" y="-5" width="240" height="22" class="list-item-selected" rx="2"/>
      <text x="0" y="10" class="list-item">📄 01-01-001 客户行为分析</text>
      <text x="0" y="32" class="list-item">📄 01-01-002 客户画像生成</text>
      <text x="0" y="54" class="list-item">📄 01-01-003 客户流失预警</text>
      <text x="0" y="76" class="list-item">📄 01-01-004 客户价值评估</text>
      <text x="0" y="98" class="list-item">📄 01-01-005 客户分群分析</text>
      <text x="0" y="120" class="list-item">📄 01-01-006 客户生命周期</text>
      <text x="0" y="142" class="list-item">📄 01-01-007 客户满意度分析</text>
      <text x="0" y="164" class="list-item" fill="#999">📄 01-01-008 客户推荐策略</text>
      <text x="0" y="186" class="list-item" fill="#999">📄 01-01-009 客户沟通记录</text>
    </g>

    <!-- 搜索框 -->
    <rect x="40" y="700" width="200" height="24" class="input" rx="3"/>
    <text x="50" y="716" class="text" fill="#aaa">🔍 搜索提示词...</text>
    <rect x="245" y="700" width="35" height="24" class="button-secondary" rx="3"/>
    <text x="255" y="716" class="text-small">筛选</text>
  </g>

  <!-- ===== 右侧面板 ===== -->
  <g id="right-panel">
    
    <!-- 顶部信息栏 -->
    <rect x="300" y="65" width="870" height="50" class="panel" rx="3"/>
    <text x="315" y="85" class="label-bold">当前提示词:</text>
    <text x="400" y="85" class="label" fill="#4a90d9">[01-01-001] 客户行为分析</text>
    
    <!-- 版本选择 -->
    <text x="650" y="85" class="label-bold">版本:</text>
    <rect x="690" y="72" width="35" height="20" class="version-active" rx="3"/>
    <text x="700" y="86" class="button-text" style="font-size:10px">V1★</text>
    <rect x="730" y="72" width="28" height="20" class="version-inactive" rx="3"/>
    <text x="737" y="86" class="text-small">V2</text>
    <rect x="763" y="72" width="28" height="20" class="version-inactive" rx="3"/>
    <text x="770" y="86" class="text-small">V3</text>
    <rect x="796" y="72" width="28" height="20" class="version-inactive" rx="3"/>
    <text x="803" y="86" class="text-small">V4</text>
    
    <!-- 版本对比按钮 -->
    <rect x="840" y="72" width="70" height="20" class="button-secondary" rx="3"/>
    <text x="855" y="86" class="text-small">📊 版本对比</text>

    <!-- 元提示词提示 -->
    <text x="315" y="105" class="text-small">🔗 关联元提示词: META-001 (系统安全约束)</text>
    <text x="550" y="105" class="text-small" fill="#4a90d9" style="cursor:pointer">[展开查看]</text>

    <!-- 描述编辑区 -->
    <rect x="300" y="120" width="420" height="80" class="panel" rx="3"/>
    <rect x="300" y="120" width="420" height="22" class="panel-header" rx="3"/>
    <text x="315" y="136" class="label-bold">📝 提示词描述</text>
    <text x="680" y="136" class="text-small" fill="#4a90d9">[编辑]</text>
    <rect x="310" y="148" width="400" height="45" class="input" rx="2"/>
    <text x="318" y="165" class="text">用于分析客户的行为数据，识别购买模式和偏好。</text>
    <text x="318" y="180" class="text">输出格式为结构化JSON，包含行为标签和置信度。</text>

    <!-- 变量定义区 -->
    <rect x="730" y="120" width="440" height="80" class="panel" rx="3"/>
    <rect x="730" y="120" width="440" height="22" class="panel-header" rx="3"/>
    <text x="745" y="136" class="label-bold">⚙️ 变量定义</text>
    <text x="1100" y="136" class="text-small" fill="#4a90d9">[+ 添加]</text>
    
    <!-- 变量网格 (自绘) -->
    <g transform="translate(740, 148)">
      <!-- 表头 -->
      <rect x="0" y="0" width="120" height="18" class="grid-header"/>
      <rect x="120" y="0" width="80" height="18" class="grid-header"/>
      <rect x="200" y="0" width="180" height="18" class="grid-header"/>
      <rect x="380" y="0" width="40" height="18" class="grid-header"/>
      <text x="5" y="13" class="text-small" font-weight="bold">Name</text>
      <text x="125" y="13" class="text-small" font-weight="bold">Type</text>
      <text x="205" y="13" class="text-small" font-weight="bold">Value / Default</text>
      <text x="385" y="13" class="text-small" font-weight="bold">操作</text>
      <!-- 数据行1 -->
      <rect x="0" y="18" width="120" height="16" class="grid-cell"/>
      <rect x="120" y="18" width="80" height="16" class="grid-cell"/>
      <rect x="200" y="18" width="180" height="16" class="grid-cell"/>
      <rect x="380" y="18" width="40" height="16" class="grid-cell"/>
      <text x="5" y="30" class="text-small">customer_id</text>
      <text x="125" y="30" class="text-small" fill="#0066cc">Integer</text>
      <text x="205" y="30" class="text-small">{{BoundQuery.ID}}</text>
      <text x="390" y="30" class="text-small">⚙ ×</text>
      <!-- 数据行2 -->
      <rect x="0" y="34" width="120" height="16" class="grid-cell"/>
      <rect x="120" y="34" width="80" height="16" class="grid-cell"/>
      <rect x="200" y="34" width="180" height="16" class="grid-cell"/>
      <rect x="380" y="34" width="40" height="16" class="grid-cell"/>
      <text x="5" y="46" class="text-small">date_range</text>
      <text x="125" y="46" class="text-small" fill="#0066cc">String</text>
      <text x="205" y="46" class="text-small">"last_30_days"</text>
      <text x="390" y="46" class="text-small">⚙ ×</text>
    </g>

    <!-- BoundQuery 配置 -->
    <text x="740" y="196" class="text-small">BoundQuery:</text>
    <rect x="810" y="183" width="150" height="18" class="input" rx="2"/>
    <text x="818" y="196" class="text-small">qry_CustomerDetail ▼</text>
    <rect x="965" y="183" width="55" height="18" class="button-secondary" rx="2"/>
    <text x="973" y="196" class="text-small">预览SQL</text>

    <!-- ===== 提示词内容编辑区 ===== -->
    <rect x="300" y="205" width="870" height="200" class="panel" rx="3"/>
    <rect x="300" y="205" width="870" height="22" class="panel-header" rx="3"/>
    <text x="315" y="221" class="label-bold">✏️ 提示词内容 (V1)</text>
    <text x="1050" y="221" class="text-small">Tokens: 245</text>
    
    <!-- 提示词文本框 -->
    <rect x="310" y="233" width="850" height="130" class="input-focus" rx="3"/>
    <text x="320" y="253" class="text" xml:space="preserve">你是一个专业的客户行为分析师。请根据以下客户数据进行分析：</text>
    <text x="320" y="273" class="text" xml:space="preserve"></text>
    <text x="320" y="293" class="text" xml:space="preserve">客户ID: {{customer_id}}</text>
    <text x="320" y="313" class="text" xml:space="preserve">时间范围: {{date_range}}</text>
    <text x="320" y="333" class="text" xml:space="preserve">原始数据: {{context_data}}</text>
    <text x="320" y="353" class="text" xml:space="preserve"></text>
    
    <!-- 发送按钮区域 -->
    <rect x="1040" y="370" width="120" height="28" class="button" rx="4"/>
    <text x="1075" y="389" class="button-text" text-anchor="middle">▶ 发送测试</text>
    
    <rect x="940" y="372" width="90" height="24" class="button-secondary" rx="3"/>
    <text x="965" y="388" class="button-secondary-text">💾 保存</text>

    <!-- ===== LLM 回复显示区 ===== -->
    <rect x="300" y="410" width="870" height="280" class="panel" rx="3"/>
    <rect x="300" y="410" width="870" height="22" class="panel-header" rx="3"/>
    <text x="315" y="426" class="label-bold">💬 LLM 回复</text>
    
    <!-- 状态信息 -->
    <text x="750" y="426" class="text-small">模型: gpt-4o</text>
    <text x="850" y="426" class="text-small">耗时: 1.25s</text>
    <text x="930" y="426" class="text-small">Tokens: 312</text>
    <text x="1010" y="426" class="text-small">费用: $0.08</text>
    <text x="1100" y="426" class="text-small" fill="#4a90d9">[复制]</text>
    
    <!-- 回复内容区 -->
    <rect x="310" y="438" width="850" height="200" class="response-area" rx="3"/>
    <g transform="translate(320, 455)">
      <text x="0" y="0" class="text" font-weight="bold">📊 客户行为分析报告</text>
      <text x="0" y="20" class="text"></text>
      <text x="0" y="40" class="text" font-weight="bold">1. 购买行为模式</text>
      <text x="0" y="58" class="text">• 该客户在过去30天内共完成 12 次购买</text>
      <text x="0" y="76" class="text">• 平均客单价: ¥258.50</text>
      <text x="0" y="94" class="text">• 购买高峰时段: 晚间 20:00-22:00</text>
      <text x="0" y="112" class="text"></text>
      <text x="0" y="130" class="text" font-weight="bold">2. 偏好标签</text>
      <text x="0" y="148" class="text">• 品类偏好: 电子产品 (65%), 家居用品 (25%)</text>
      <text x="0" y="166" class="text">• 价格敏感度: 中等 (关注促销活动)</text>
    </g>
    
    <!-- 底部操作按钮 -->
    <rect x="310" y="645" width="90" height="24" class="button-secondary" rx="3"/>
    <text x="330" y="661" class="button-secondary-text">📋 保存用例</text>
    
    <rect x="410" y="645" width="90" height="24" class="button-secondary" rx="3"/>
    <text x="427" y="661" class="button-secondary-text">📜 历史记录</text>
    
    <rect x="510" y="645" width="80" height="24" class="button-secondary" rx="3"/>
    <text x="530" y="661" class="button-secondary-text">🔄 重试</text>

    <!-- 滚动条 -->
    <rect x="1145" y="438" width="8" height="200" fill="#eee" rx="4"/>
    <rect x="1145" y="438" width="8" height="80" fill="#ccc" rx="4"/>
  </g>

  <!-- ===== 底部状态栏 ===== -->
  <rect x="20" y="755" width="1160" height="25" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="772" class="text-small">就绪 | 当前LLM: LiteLLM/gpt-4o | 今日调用: 23次 | 今日费用: $1.85</text>
  <text x="1100" y="772" class="text-small">v1.0</text>

</svg>
