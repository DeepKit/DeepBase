<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .header-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .sidebar-bg { fill: #263238; }
      .sidebar-text { fill: #cfd8dc; font-family: Arial, sans-serif; font-size: 12px; }
      .sidebar-active { fill: #37474f; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>
  <rect width="600" height="400" class="bg" />
  
          <text x="10" y="20" class="title">Studio_ProjectManager</text>
          <rect x="10" y="30" width="580" height="360" class="ctrl-bg" />
          
          <!-- List -->
          <rect x="20" y="40" width="200" height="340" fill="#fff" stroke="#999" />
          <rect x="20" y="40" width="200" height="25" class="header-bg" />
          <text x="25" y="57" class="label" font-weight="bold">Projects List</text>
          
          <rect x="21" y="66" width="198" height="25" class="ctrl-active" />
          <text x="25" y="82" class="label">MyApp</text>
          <line x1="20" y1="91" x2="220" y2="91" class="grid-line"/>
          <text x="25" y="107" class="label">AdminTool</text>
          <line x1="20" y1="116" x2="220" y2="116" class="grid-line"/>
          <text x="25" y="132" class="label">DataSync</text>
          
          <!-- Details -->
          <rect x="230" y="40" width="350" height="340" fill="#fff" stroke="#999" />
          <text x="240" y="60" class="title">Project Details</text>
          
          <text x="240" y="90" class="label">Name:</text>
          <rect x="300" y="78" width="200" height="20" class="ctrl-bg"/>
          <text x="305" y="92" class="label">MyApp</text>
          
          <text x="240" y="120" class="label">Config DB:</text>
          <rect x="300" y="108" width="250" height="20" class="ctrl-bg"/>
          <text x="305" y="122" class="label">D:\Projects\MyApp\config.db</text>
          
          <text x="240" y="150" class="label">Version:</text>
          <rect x="300" y="138" width="100" height="20" class="ctrl-bg"/>
          <text x="305" y="152" class="label">1.0.0</text>
          
          <text x="240" y="180" class="label">Description:</text>
          <rect x="300" y="170" width="250" height="60" class="ctrl-bg"/>
          
          <!-- Buttons -->
          <rect x="240" y="340" width="80" height="25" fill="#4caf50" rx="3"/>
          <text x="280" y="357" class="label" fill="#fff" text-anchor="middle">Open</text>
          
          <rect x="330" y="340" width="80" height="25" fill="#f44336" rx="3"/>
          <text x="370" y="357" class="label" fill="#fff" text-anchor="middle">Delete</text>
        
</svg>