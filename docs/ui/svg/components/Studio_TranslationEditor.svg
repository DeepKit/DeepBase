<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .header-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .sidebar-bg { fill: #263238; }
      .sidebar-text { fill: #cfd8dc; font-family: Arial, sans-serif; font-size: 12px; }
      .sidebar-active { fill: #37474f; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>
  <rect width="800" height="500" class="bg" />
  
          <text x="10" y="20" class="title">Studio_TranslationEditor</text>
          <rect x="10" y="30" width="780" height="460" class="ctrl-bg" />
          
          <!-- Toolbar -->
          <rect x="10" y="30" width="780" height="40" fill="#f5f5f5" stroke="#ddd"/>
          <text x="20" y="55" class="label">Source: <b>English</b></text>
          <text x="120" y="55" class="label">Target: <b>Chinese (Simplified)</b></text>
          
          <rect x="300" y="38" width="100" height="24" fill="#673ab7" rx="3"/>
          <text x="350" y="54" class="label" fill="#fff" text-anchor="middle">🤖 AI Translate</text>
          
          <rect x="410" y="38" width="80" height="24" fill="#009688" rx="3"/>
          <text x="450" y="54" class="label" fill="#fff" text-anchor="middle">Scan Code</text>
          
          <!-- Grid -->
          <g transform="translate(20, 80)">
             <rect width="760" height="400" fill="#fff" stroke="#999"/>
             
             <!-- Header -->
             <rect width="760" height="25" class="header-bg"/>
             <text x="5" y="17" class="label" font-weight="bold">ID</text>
             <text x="50" y="17" class="label" font-weight="bold">Source Text (Key)</text>
             <text x="300" y="17" class="label" font-weight="bold">Translation (zh-CN)</text>
             <text x="600" y="17" class="label" font-weight="bold">Status</text>
             <text x="680" y="17" class="label" font-weight="bold">Context</text>
             
             <!-- Row 1 -->
             <rect x="0" y="25" width="760" height="25" fill="#fff"/>
             <text x="5" y="42" class="label">1</text>
             <text x="50" y="42" class="label">File</text>
             <text x="300" y="42" class="label">文件</text>
             <text x="600" y="42" class="label" fill="green">✓ Verified</text>
             <text x="680" y="42" class="label" fill="#999">Menu</text>
             <line x1="0" y1="50" x2="760" y2="50" class="grid-line"/>
             
             <!-- Row 2 -->
             <rect x="0" y="50" width="760" height="25" fill="#fff"/>
             <text x="5" y="67" class="label">2</text>
             <text x="50" y="67" class="label">Open...</text>
             <text x="300" y="67" class="label">打开...</text>
             <text x="600" y="67" class="label" fill="green">✓ Verified</text>
             <text x="680" y="67" class="label" fill="#999">Action</text>
             <line x1="0" y1="75" x2="760" y2="75" class="grid-line"/>
             
             <!-- Row 3 (Missing) -->
             <rect x="0" y="75" width="760" height="25" fill="#ffebee"/>
             <text x="5" y="92" class="label">3</text>
             <text x="50" y="92" class="label">Save As</text>
             <text x="300" y="92" class="label" fill="#ccc">(Empty)</text>
             <text x="600" y="92" class="label" fill="red">! Missing</text>
             <line x1="0" y1="100" x2="760" y2="100" class="grid-line"/>
          </g>
        
</svg>