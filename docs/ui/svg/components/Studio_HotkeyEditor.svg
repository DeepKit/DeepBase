<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .header-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .sidebar-bg { fill: #263238; }
      .sidebar-text { fill: #cfd8dc; font-family: Arial, sans-serif; font-size: 12px; }
      .sidebar-active { fill: #37474f; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>
  <rect width="500" height="400" class="bg" />
  
          <text x="10" y="20" class="title">Studio_HotkeyEditor</text>
          <rect x="10" y="30" width="480" height="360" class="ctrl-bg" />
          
          <!-- Category Filter -->
          <text x="20" y="50" class="label">Category:</text>
          <rect x="80" y="38" width="150" height="20" fill="#fff" stroke="#ccc"/>
          <text x="85" y="52" class="label">General</text>
          
          <!-- Grid -->
          <g transform="translate(20, 70)">
             <rect width="460" height="200" fill="#fff" stroke="#999"/>
             <rect width="460" height="20" class="header-bg"/>
             <text x="5" y="14" class="label" font-weight="bold">Action</text>
             <text x="200" y="14" class="label" font-weight="bold">Shortcut</text>
             <text x="350" y="14" class="label" font-weight="bold">Global</text>
             
             <!-- Row 1 -->
             <rect x="0" y="20" width="460" height="25" fill="#fff"/>
             <text x="5" y="37" class="label">File.Save</text>
             <rect x="200" y="22" width="100" height="20" fill="#eee" stroke="#ccc" rx="2"/>
             <text x="250" y="36" class="label" text-anchor="middle">Ctrl+S</text>
             <text x="355" y="37" class="label">☐</text>
             <line x1="0" y1="45" x2="460" y2="45" class="grid-line"/>
             
             <!-- Row 2 -->
             <rect x="0" y="45" width="460" height="25" fill="#fff"/>
             <text x="5" y="62" class="label">Edit.Copy</text>
             <rect x="200" y="47" width="100" height="20" fill="#eee" stroke="#ccc" rx="2"/>
             <text x="250" y="61" class="label" text-anchor="middle">Ctrl+C</text>
             <text x="355" y="62" class="label">☐</text>
             <line x1="0" y1="70" x2="460" y2="70" class="grid-line"/>
          </g>
          
          <!-- Editor Panel -->
          <rect x="20" y="280" width="460" height="100" fill="#fff" stroke="#999"/>
          <text x="30" y="300" class="label" font-weight="bold">Edit Shortcut:</text>
          
          <text x="30" y="330" class="label">Press keys:</text>
          <rect x="100" y="315" width="200" height="30" fill="#e3f2fd" stroke="#2196f3"/>
          <text x="200" y="335" class="label" text-anchor="middle" font-size="14px" font-weight="bold">Ctrl + Shift + S</text>
          
          <rect x="320" y="315" width="80" height="30" fill="#4caf50" rx="3"/>
          <text x="360" y="335" class="label" fill="#fff" text-anchor="middle">Assign</text>
          
          <text x="30" y="365" class="label" fill="orange">⚠ Conflict: Used by 'Project.SaveAll'</text>
        
</svg>