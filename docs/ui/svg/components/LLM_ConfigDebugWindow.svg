<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
  <defs>
    <style>
      .bg { fill: #f0f0f0; }
      .window-bg { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .titlebar { fill: #673ab7; }
      .titlebar-text { font-family: Microsoft YaHei, Arial; font-size: 14px; fill: white; font-weight: bold; }
      .panel { fill: #fafafa; stroke: #ddd; stroke-width: 1; }
      .panel-header { fill: #e8e8e8; stroke: #ccc; stroke-width: 1; }
      .label { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: #333; }
      .label-bold { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: #333; font-weight: bold; }
      .text { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #666; }
      .text-small { font-family: Microsoft YaHei, Arial; font-size: 10px; fill: #888; }
      .text-mono { font-family: Consolas, monospace; font-size: 10px; fill: #333; }
      .input { fill: #ffffff; stroke: #ccc; stroke-width: 1; }
      .input-focus { fill: #ffffff; stroke: #673ab7; stroke-width: 2; }
      .button { fill: #673ab7; stroke: #5e35b1; stroke-width: 1; }
      .button-success { fill: #4caf50; stroke: #43a047; stroke-width: 1; }
      .button-text { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: white; font-weight: bold; }
      .button-secondary { fill: #e0e0e0; stroke: #bbb; stroke-width: 1; }
      .button-secondary-text { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #333; }
      .checkbox { fill: #fff; stroke: #999; stroke-width: 1; }
      .checkbox-checked { fill: #673ab7; stroke: #5e35b1; stroke-width: 1; }
      .grid-header { fill: #f5f5f5; stroke: #ddd; stroke-width: 1; }
      .grid-row { fill: #fff; stroke: #eee; stroke-width: 1; }
      .grid-row-alt { fill: #fafafa; stroke: #eee; stroke-width: 1; }
      .grid-row-selected { fill: #ede7f6; stroke: #673ab7; stroke-width: 1; }
      .status-success { fill: #4caf50; }
      .status-error { fill: #f44336; }
      .status-pending { fill: #ff9800; }
      .response-area { fill: #f5f5f5; stroke: #ddd; stroke-width: 1; }
      .splitter { fill: #e0e0e0; stroke: #ccc; stroke-width: 1; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1100" height="750" class="bg"/>

  <!-- 主窗口 -->
  <rect x="20" y="20" width="1060" height="710" class="window-bg" rx="5"/>

  <!-- 标题栏 -->
  <rect x="20" y="20" width="1060" height="35" class="titlebar" rx="5"/>
  <rect x="20" y="40" width="1060" height="15" class="titlebar"/>
  <text x="40" y="43" class="titlebar-text">⚙️ LLM 配置与调试</text>
  <text x="1030" y="43" class="titlebar-text" style="font-size:16px">×</text>
  <text x="1000" y="43" class="titlebar-text" style="font-size:12px">□</text>

  <!-- ===== 上部区域 (两栏) ===== -->
  
  <!-- 左侧：LLM 属性编辑 -->
  <g id="config-panel">
    <rect x="30" y="65" width="480" height="320" class="panel" rx="4"/>
    <rect x="30" y="65" width="480" height="28" class="panel-header" rx="4"/>
    <rect x="30" y="85" width="480" height="8" class="panel-header"/>
    <text x="45" y="84" class="label-bold">⚙️ LLM 配置属性</text>
    <text x="460" y="84" class="text-small" fill="#673ab7">[新建]</text>

    <!-- 配置表单 -->
    <g transform="translate(45, 105)">
      <!-- 启用 + 名称 -->
      <rect x="0" y="0" width="14" height="14" class="checkbox-checked" rx="2"/>
      <text x="5" y="11" style="font-size:10px; fill:white">✓</text>
      <text x="20" y="12" class="label">启用</text>
      
      <text x="80" y="12" class="label">配置名称:</text>
      <rect x="150" y="0" width="150" height="20" class="input" rx="2"/>
      <text x="158" y="14" class="text">默认LLM配置</text>
      
      <rect x="310" y="0" width="70" height="20" class="button-secondary" rx="3"/>
      <text x="325" y="14" class="button-secondary-text">设为默认</text>

      <!-- Provider -->
      <text x="0" y="42" class="label">Provider:</text>
      <rect x="80" y="30" width="120" height="20" class="input" rx="2"/>
      <text x="88" y="44" class="text">LiteLLM ▼</text>

      <text x="220" y="42" class="label">Model:</text>
      <rect x="270" y="30" width="120" height="20" class="input" rx="2"/>
      <text x="278" y="44" class="text">gpt-4o ▼</text>

      <!-- API 地址 -->
      <text x="0" y="72" class="label">API 地址:</text>
      <rect x="80" y="60" width="370" height="20" class="input" rx="2"/>
      <text x="88" y="74" class="text">https://api.litellm.ai/v1</text>

      <!-- API Key -->
      <text x="0" y="102" class="label">API Key:</text>
      <rect x="80" y="90" width="300" height="20" class="input" rx="2"/>
      <text x="88" y="104" class="text">sk-****************************</text>
      <rect x="385" y="90" width="24" height="20" class="button-secondary" rx="2"/>
      <text x="392" y="104" class="text-small">👁</text>
      <rect x="415" y="90" width="35" height="20" class="button-secondary" rx="2"/>
      <text x="422" y="104" class="text-small">复制</text>

      <!-- Temperature + Max Tokens -->
      <text x="0" y="132" class="label">Temperature:</text>
      <rect x="80" y="120" width="60" height="20" class="input" rx="2"/>
      <text x="88" y="134" class="text">0.7</text>
      <!-- 滑块 -->
      <rect x="145" y="128" width="80" height="4" fill="#e0e0e0" rx="2"/>
      <circle cx="200" cy="130" r="6" fill="#673ab7"/>

      <text x="240" y="132" class="label">Max Tokens:</text>
      <rect x="320" y="120" width="80" height="20" class="input" rx="2"/>
      <text x="328" y="134" class="text">4096</text>

      <!-- Timeout + Retry -->
      <text x="0" y="162" class="label">Timeout:</text>
      <rect x="80" y="150" width="60" height="20" class="input" rx="2"/>
      <text x="88" y="164" class="text">60000</text>
      <text x="145" y="162" class="text-small">ms</text>

      <text x="180" y="162" class="label">重试次数:</text>
      <rect x="250" y="150" width="40" height="20" class="input" rx="2"/>
      <text x="263" y="164" class="text">3</text>

      <text x="300" y="162" class="label">重试延迟:</text>
      <rect x="370" y="150" width="50" height="20" class="input" rx="2"/>
      <text x="378" y="164" class="text">1000</text>
      <text x="425" y="162" class="text-small">ms</text>

      <!-- 价格配置 -->
      <text x="0" y="192" class="label">输入价格/1K:</text>
      <rect x="90" y="180" width="60" height="20" class="input" rx="2"/>
      <text x="98" y="194" class="text">$0.015</text>

      <text x="170" y="192" class="label">输出价格/1K:</text>
      <rect x="260" y="180" width="60" height="20" class="input" rx="2"/>
      <text x="268" y="194" class="text">$0.060</text>

      <!-- 操作按钮 -->
      <rect x="0" y="215" width="70" height="24" class="button" rx="4"/>
      <text x="20" y="231" class="button-text" style="font-size:11px">💾 保存</text>
      
      <rect x="80" y="215" width="70" height="24" class="button-secondary" rx="4"/>
      <text x="97" y="231" class="button-secondary-text">⟲ 重置</text>
      
      <rect x="160" y="215" width="70" height="24" class="button-secondary" rx="4"/>
      <text x="178" y="231" class="button-secondary-text">📋 复制</text>
      
      <rect x="240" y="215" width="70" height="24" class="button-secondary" rx="4"/>
      <text x="258" y="231" class="button-secondary-text">🗑 删除</text>
    </g>
  </g>

  <!-- 右侧：测试区域 -->
  <g id="test-panel">
    <rect x="520" y="65" width="550" height="320" class="panel" rx="4"/>
    <rect x="520" y="65" width="550" height="28" class="panel-header" rx="4"/>
    <rect x="520" y="85" width="550" height="8" class="panel-header"/>
    <text x="535" y="84" class="label-bold">🧪 连接测试</text>

    <!-- 测试输入区 -->
    <text x="535" y="112" class="label">测试提示词:</text>
    <rect x="535" y="120" width="520" height="80" class="input-focus" rx="3"/>
    <text x="545" y="140" class="text">你好，请简单介绍一下你自己。</text>
    <text x="545" y="158" class="text" fill="#999">(用于验证 LLM 连接是否正常)</text>

    <!-- 测试按钮 -->
    <rect x="535" y="210" width="100" height="28" class="button-success" rx="4"/>
    <text x="560" y="229" class="button-text" style="font-size:12px">▶ 测试连接</text>
    
    <rect x="645" y="210" width="80" height="28" class="button-secondary" rx="4"/>
    <text x="665" y="229" class="button-secondary-text">清空结果</text>

    <!-- 状态指示 -->
    <circle cx="750" cy="224" r="8" class="status-success"/>
    <text x="765" y="229" class="label" fill="#4caf50">连接成功</text>
    <text x="850" y="229" class="text-small">耗时: 856ms | Tokens: 45 | 费用: $0.002</text>

    <!-- 测试结果区 -->
    <text x="535" y="258" class="label">测试结果:</text>
    <rect x="535" y="266" width="520" height="105" class="response-area" rx="3"/>
    <g transform="translate(545, 282)">
      <text x="0" y="0" class="text">你好！我是一个AI语言模型助手。我可以帮助你：</text>
      <text x="0" y="18" class="text">• 回答问题和提供信息</text>
      <text x="0" y="36" class="text">• 协助写作和编辑文本</text>
      <text x="0" y="54" class="text">• 进行代码相关的讨论和帮助</text>
      <text x="0" y="72" class="text">• 翻译和语言学习支持</text>
    </g>

    <!-- 滚动条 -->
    <rect x="1040" y="266" width="6" height="105" fill="#eee" rx="3"/>
    <rect x="1040" y="266" width="6" height="50" fill="#ccc" rx="3"/>
  </g>

  <!-- ===== 分隔条 ===== -->
  <rect x="30" y="390" width="1040" height="6" class="splitter" rx="2"/>
  <line x1="540" y1="393" x2="560" y2="393" stroke="#999" stroke-width="2"/>

  <!-- ===== 下部：LLM 配置列表 ===== -->
  <g id="config-list">
    <rect x="30" y="400" width="1040" height="280" class="panel" rx="4"/>
    <rect x="30" y="400" width="1040" height="28" class="panel-header" rx="4"/>
    <rect x="30" y="420" width="1040" height="8" class="panel-header"/>
    <text x="45" y="419" class="label-bold">📋 所有 LLM 配置</text>
    
    <!-- 工具栏 -->
    <rect x="800" y="407" width="70" height="18" class="button-secondary" rx="3"/>
    <text x="817" y="420" class="text-small">+ 新建</text>
    <rect x="880" y="407" width="70" height="18" class="button-secondary" rx="3"/>
    <text x="893" y="420" class="text-small">📥 导入</text>
    <rect x="960" y="407" width="70" height="18" class="button-secondary" rx="3"/>
    <text x="973" y="420" class="text-small">📤 导出</text>

    <!-- Grid 表头 -->
    <g transform="translate(40, 435)">
      <rect x="0" y="0" width="40" height="22" class="grid-header"/>
      <rect x="40" y="0" width="140" height="22" class="grid-header"/>
      <rect x="180" y="0" width="100" height="22" class="grid-header"/>
      <rect x="280" y="0" width="120" height="22" class="grid-header"/>
      <rect x="400" y="0" width="180" height="22" class="grid-header"/>
      <rect x="580" y="0" width="80" height="22" class="grid-header"/>
      <rect x="660" y="0" width="80" height="22" class="grid-header"/>
      <rect x="740" y="0" width="80" height="22" class="grid-header"/>
      <rect x="820" y="0" width="100" height="22" class="grid-header"/>
      <rect x="920" y="0" width="100" height="22" class="grid-header"/>
      
      <text x="10" y="15" class="text-small" font-weight="bold">启用</text>
      <text x="50" y="15" class="text-small" font-weight="bold">配置名称</text>
      <text x="190" y="15" class="text-small" font-weight="bold">Provider</text>
      <text x="290" y="15" class="text-small" font-weight="bold">Model</text>
      <text x="410" y="15" class="text-small" font-weight="bold">API 地址</text>
      <text x="590" y="15" class="text-small" font-weight="bold">状态</text>
      <text x="670" y="15" class="text-small" font-weight="bold">调用次数</text>
      <text x="750" y="15" class="text-small" font-weight="bold">成功率</text>
      <text x="830" y="15" class="text-small" font-weight="bold">今日费用</text>
      <text x="930" y="15" class="text-small" font-weight="bold">操作</text>
    </g>

    <!-- Grid 数据行 -->
    <g transform="translate(40, 457)">
      <!-- Row 1 (选中) -->
      <rect x="0" y="0" width="1020" height="28" class="grid-row-selected"/>
      <rect x="13" y="7" width="14" height="14" class="checkbox-checked" rx="2"/>
      <text x="18" y="18" style="font-size:9px; fill:white">✓</text>
      <text x="50" y="18" class="text-small" font-weight="bold">默认LLM配置</text>
      <text x="145" y="18" class="text-small" fill="#673ab7">★</text>
      <text x="190" y="18" class="text-small">LiteLLM</text>
      <text x="290" y="18" class="text-small">gpt-4o</text>
      <text x="410" y="18" class="text-small">https://api.litellm.ai/v1</text>
      <circle cx="600" cy="14" r="5" class="status-success"/>
      <text x="612" y="18" class="text-small" fill="#4caf50">正常</text>
      <text x="680" y="18" class="text-small">1,256</text>
      <text x="760" y="18" class="text-small">98.5%</text>
      <text x="840" y="18" class="text-small">$12.50</text>
      <text x="940" y="18" class="text-small" fill="#673ab7">[编辑] [测试]</text>

      <!-- Row 2 -->
      <rect x="0" y="28" width="1020" height="28" class="grid-row-alt"/>
      <rect x="13" y="35" width="14" height="14" class="checkbox-checked" rx="2"/>
      <text x="18" y="46" style="font-size:9px; fill:white">✓</text>
      <text x="50" y="46" class="text-small">OpenAI Direct</text>
      <text x="190" y="46" class="text-small">OpenAI</text>
      <text x="290" y="46" class="text-small">gpt-4-turbo</text>
      <text x="410" y="46" class="text-small">https://api.openai.com/v1</text>
      <circle cx="600" cy="42" r="5" class="status-success"/>
      <text x="612" y="46" class="text-small" fill="#4caf50">正常</text>
      <text x="680" y="46" class="text-small">523</text>
      <text x="760" y="46" class="text-small">97.2%</text>
      <text x="840" y="46" class="text-small">$8.30</text>
      <text x="940" y="46" class="text-small" fill="#673ab7">[编辑] [测试]</text>

      <!-- Row 3 -->
      <rect x="0" y="56" width="1020" height="28" class="grid-row"/>
      <rect x="13" y="63" width="14" height="14" class="checkbox" rx="2"/>
      <text x="50" y="74" class="text-small" fill="#999">Claude API</text>
      <text x="190" y="74" class="text-small" fill="#999">Anthropic</text>
      <text x="290" y="74" class="text-small" fill="#999">claude-3-opus</text>
      <text x="410" y="74" class="text-small" fill="#999">https://api.anthropic.com</text>
      <circle cx="600" cy="70" r="5" class="status-pending"/>
      <text x="612" y="74" class="text-small" fill="#ff9800">未测试</text>
      <text x="680" y="74" class="text-small" fill="#999">0</text>
      <text x="760" y="74" class="text-small" fill="#999">-</text>
      <text x="840" y="74" class="text-small" fill="#999">$0.00</text>
      <text x="940" y="74" class="text-small" fill="#673ab7">[编辑] [测试]</text>

      <!-- Row 4 -->
      <rect x="0" y="84" width="1020" height="28" class="grid-row-alt"/>
      <rect x="13" y="91" width="14" height="14" class="checkbox-checked" rx="2"/>
      <text x="18" y="102" style="font-size:9px; fill:white">✓</text>
      <text x="50" y="102" class="text-small">本地 Ollama</text>
      <text x="190" y="102" class="text-small">Ollama</text>
      <text x="290" y="102" class="text-small">llama3:8b</text>
      <text x="410" y="102" class="text-small">http://localhost:11434</text>
      <circle cx="600" cy="98" r="5" class="status-error"/>
      <text x="612" y="102" class="text-small" fill="#f44336">离线</text>
      <text x="680" y="102" class="text-small">89</text>
      <text x="760" y="102" class="text-small">85.0%</text>
      <text x="840" y="102" class="text-small">$0.00</text>
      <text x="940" y="102" class="text-small" fill="#673ab7">[编辑] [测试]</text>

      <!-- Row 5 -->
      <rect x="0" y="112" width="1020" height="28" class="grid-row"/>
      <rect x="13" y="119" width="14" height="14" class="checkbox-checked" rx="2"/>
      <text x="18" y="130" style="font-size:9px; fill:white">✓</text>
      <text x="50" y="130" class="text-small">Azure OpenAI</text>
      <text x="190" y="130" class="text-small">Azure</text>
      <text x="290" y="130" class="text-small">gpt-4</text>
      <text x="410" y="130" class="text-small">https://xxx.openai.azure.com</text>
      <circle cx="600" cy="126" r="5" class="status-success"/>
      <text x="612" y="130" class="text-small" fill="#4caf50">正常</text>
      <text x="680" y="130" class="text-small">312</text>
      <text x="760" y="130" class="text-small">99.1%</text>
      <text x="840" y="130" class="text-small">$5.60</text>
      <text x="940" y="130" class="text-small" fill="#673ab7">[编辑] [测试]</text>
    </g>

    <!-- 滚动条 -->
    <rect x="1050" y="457" width="8" height="150" fill="#eee" rx="4"/>
    <rect x="1050" y="457" width="8" height="80" fill="#ccc" rx="4"/>

    <!-- 统计信息 -->
    <rect x="40" y="620" width="1020" height="25" fill="#f5f5f5" rx="3"/>
    <text x="55" y="637" class="text-small">
      共 5 个配置 | 启用: 4 | 在线: 3 | 今日总调用: 2,180 次 | 今日总费用: $26.40
    </text>
  </g>

  <!-- ===== 底部状态栏 ===== -->
  <rect x="20" y="700" width="1060" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="720" class="text-small">就绪 | 默认配置: LiteLLM/gpt-4o | 上次测试: 2024-11-30 14:30:25</text>
  <text x="980" y="720" class="text-small">v1.0</text>

</svg>
