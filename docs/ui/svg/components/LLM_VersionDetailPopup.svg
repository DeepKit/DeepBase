<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .bg { fill: #f0f0f0; }
      .window-bg { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .titlebar { fill: #4a90d9; }
      .titlebar-text { font-family: Microsoft YaHei, Arial; font-size: 14px; fill: white; font-weight: bold; }
      .panel { fill: #fafafa; stroke: #ddd; stroke-width: 1; }
      .panel-header { fill: #e8e8e8; stroke: #ccc; stroke-width: 1; }
      .label { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: #333; }
      .label-bold { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: #333; font-weight: bold; }
      .text { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #666; }
      .text-small { font-family: Microsoft YaHei, Arial; font-size: 10px; fill: #888; }
      .text-mono { font-family: Consolas, monospace; font-size: 11px; fill: #333; }
      .input { fill: #ffffff; stroke: #ccc; stroke-width: 1; }
      .input-focus { fill: #ffffff; stroke: #4a90d9; stroke-width: 2; }
      .button { fill: #4a90d9; stroke: #3a7bc8; stroke-width: 1; }
      .button-text { font-family: Microsoft YaHei, Arial; font-size: 12px; fill: white; font-weight: bold; }
      .button-secondary { fill: #e0e0e0; stroke: #bbb; stroke-width: 1; }
      .button-secondary-text { font-family: Microsoft YaHei, Arial; font-size: 11px; fill: #333; }
      .button-success { fill: #4caf50; stroke: #43a047; stroke-width: 1; }
      .response-area { fill: #f5f5f5; stroke: #ddd; stroke-width: 1; }
      .badge { fill: #4caf50; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="700" class="bg"/>

  <!-- 主窗口 -->
  <rect x="20" y="20" width="760" height="660" class="window-bg" rx="5"/>

  <!-- 标题栏 -->
  <rect x="20" y="20" width="760" height="35" class="titlebar" rx="5"/>
  <rect x="20" y="40" width="760" height="15" class="titlebar"/>
  <text x="40" y="43" class="titlebar-text">📄 版本详情 - [01-01-001] 客户行为分析 - Version 1</text>
  <text x="730" y="43" class="titlebar-text" style="font-size:16px">×</text>
  <text x="700" y="43" class="titlebar-text" style="font-size:12px">□</text>

  <!-- 顶部信息栏 -->
  <rect x="30" y="65" width="740" height="40" class="panel" rx="3"/>
  <text x="45" y="90" class="label-bold">版本:</text>
  <rect x="85" y="77" width="60" height="20" class="badge" rx="10"/>
  <text x="100" y="91" style="font-family: Microsoft YaHei; font-size:11px; fill:white; font-weight:bold">V1 ★生产</text>
  
  <text x="170" y="90" class="label">创建时间:</text>
  <text x="235" y="90" class="text">2024-11-28 14:30</text>
  
  <text x="360" y="90" class="label">测试次数:</text>
  <text x="420" y="90" class="text" font-weight="bold">28</text>
  
  <text x="460" y="90" class="label">成功率:</text>
  <text x="510" y="90" class="text" font-weight="bold" fill="#4caf50">93%</text>
  
  <text x="560" y="90" class="label">平均耗时:</text>
  <text x="625" y="90" class="text" font-weight="bold">1.2s</text>
  
  <rect x="680" y="75" width="80" height="24" class="button-secondary" rx="3"/>
  <text x="695" y="91" class="button-secondary-text">设为生产</text>

  <!-- 提示词内容区 (可编辑) -->
  <rect x="30" y="115" width="740" height="250" class="panel" rx="3"/>
  <rect x="30" y="115" width="740" height="25" class="panel-header" rx="3"/>
  <text x="45" y="132" class="label-bold">📝 提示词内容 (可编辑)</text>
  <text x="700" y="132" class="text-small">Tokens: 245</text>
  
  <rect x="40" y="148" width="720" height="205" class="input-focus" rx="3"/>
  <g transform="translate(50, 165)">
    <text x="0" y="0" class="text-mono" fill="#666" font-style="italic">[META-001 安全约束] (自动合并，不可编辑)</text>
    <line x1="0" y1="10" x2="700" y2="10" stroke="#eee"/>
    <text x="0" y="30" class="text-mono">你是一个专业的客户行为分析师。</text>
    <text x="0" y="48" class="text-mono">请根据以下客户数据进行分析：</text>
    <text x="0" y="66" class="text-mono"></text>
    <text x="0" y="84" class="text-mono">客户ID: {{customer_id}}</text>
    <text x="0" y="102" class="text-mono">时间范围: {{date_range}}</text>
    <text x="0" y="120" class="text-mono">原始数据: {{context_data}}</text>
    <text x="0" y="138" class="text-mono"></text>
    <text x="0" y="156" class="text-mono">请输出以下内容：</text>
    <text x="0" y="174" class="text-mono">1. 购买行为模式  2. 用户偏好标签  3. 消费趋势预测</text>
    <text x="0" y="192" class="text-mono"></text>
    <text x="0" y="210" class="text-mono">输出格式: JSON</text>
  </g>

  <!-- LLM回复区 -->
  <rect x="30" y="375" width="740" height="220" class="panel" rx="3"/>
  <rect x="30" y="375" width="740" height="25" class="panel-header" rx="3"/>
  <text x="45" y="392" class="label-bold">💬 最近一次 LLM 回复</text>
  <text x="550" y="392" class="text-small">模型: gpt-4o | 耗时: 1.2s | 费用: $0.08</text>
  <text x="730" y="392" class="text-small" fill="#4a90d9">[复制]</text>
  
  <rect x="40" y="408" width="720" height="175" class="response-area" rx="3"/>
  <g transform="translate(50, 425)">
    <text x="0" y="0" class="text-mono">{</text>
    <text x="0" y="18" class="text-mono">  "behavior": {</text>
    <text x="0" y="36" class="text-mono">    "purchase_count": 12,</text>
    <text x="0" y="54" class="text-mono">    "avg_amount": 258.50,</text>
    <text x="0" y="72" class="text-mono">    "peak_hours": "20:00-22:00",</text>
    <text x="0" y="90" class="text-mono">    "preferred_categories": ["电子产品", "家居用品"]</text>
    <text x="0" y="108" class="text-mono">  },</text>
    <text x="0" y="126" class="text-mono">  "tags": ["高频购买", "价格敏感", "晚间活跃"],</text>
    <text x="0" y="144" class="text-mono">  "trend": "increasing",</text>
    <text x="0" y="162" class="text-mono">  "confidence": 0.92</text>
  </g>

  <!-- 底部按钮栏 -->
  <rect x="30" y="605" width="740" height="45" class="panel" rx="3"/>
  
  <rect x="50" y="617" width="90" height="26" class="button-success" rx="4"/>
  <text x="70" y="634" class="button-text" style="font-size:11px">▶ 重新测试</text>
  
  <rect x="155" y="617" width="70" height="26" class="button" rx="4"/>
  <text x="170" y="634" class="button-text" style="font-size:11px">💾 保存</text>
  
  <rect x="240" y="617" width="100" height="26" class="button-secondary" rx="4"/>
  <text x="257" y="634" class="button-secondary-text">另存为新版本</text>
  
  <rect x="355" y="617" width="80" height="26" class="button-secondary" rx="4"/>
  <text x="370" y="634" class="button-secondary-text">📜 历史记录</text>
  
  <rect x="450" y="617" width="70" height="26" class="button-secondary" rx="4"/>
  <text x="465" y="634" class="button-secondary-text">📤 导出</text>

  <rect x="680" y="617" width="70" height="26" class="button-secondary" rx="4"/>
  <text x="700" y="634" class="button-secondary-text">关闭</text>

</svg>
