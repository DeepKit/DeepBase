<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .icon { fill: #666; }
      .highlight { fill: #ffeb3b; fill-opacity: 0.3; }
      .tag { fill: #e0e0e0; font-size: 9px; }
    </style>
  </defs>
  <rect width="400" height="300" class="bg" />
  
          <text x="10" y="20" class="title">TDBInitWizard</text>
          
          <rect x="10" y="30" width="380" height="260" fill="#fff" stroke="#333" />
          
          <!-- Left Sidebar -->
          <rect x="10" y="30" width="100" height="260" fill="#f0f0f0" />
          <text x="20" y="60" class="label" font-weight="bold" fill="#2196f3">1. Welcome</text>
          <text x="20" y="85" class="label">2. DB Path</text>
          <text x="20" y="110" class="label">3. Finish</text>
          
          <!-- Content -->
          <text x="130" y="60" class="label" font-size="14px" font-weight="bold">Welcome to UniBase</text>
          <text x="130" y="90" class="label">This wizard will help you initialize</text>
          <text x="130" y="110" class="label">the configuration database.</text>
          
          <!-- Image Placeholder -->
          <rect x="130" y="130" width="200" height="100" fill="#e3f2fd" stroke="#90caf9" stroke-dasharray="5 5"/>
          <text x="230" y="180" class="label" text-anchor="middle" fill="#1e88e5">Setup Graphic</text>
          
          <!-- Buttons -->
          <line x1="110" y1="250" x2="390" y2="250" stroke="#ccc" />
          <rect x="300" y="260" width="70" height="25" fill="#2196f3" rx="3"/>
          <text x="335" y="277" class="label" fill="#fff" text-anchor="middle">Next ></text>
        
</svg>