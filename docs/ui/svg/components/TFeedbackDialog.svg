<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 250" width="350" height="250">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .icon { fill: #666; }
      .highlight { fill: #ffeb3b; fill-opacity: 0.3; }
      .tag { fill: #e0e0e0; font-size: 9px; }
    </style>
  </defs>
  <rect width="350" height="250" class="bg" />
  
          <text x="10" y="20" class="title">TFeedbackDialog</text>
          
          <!-- Dialog -->
          <rect x="10" y="30" width="330" height="210" fill="#fff" stroke="#333" />
          
          <text x="20" y="50" class="label" font-weight="bold">Send Feedback</text>
          
          <text x="20" y="75" class="label">Type:</text>
          <rect x="60" y="62" width="100" height="20" fill="#fff" stroke="#ccc"/>
          <text x="65" y="76" class="label">Bug Report</text>
          
          <text x="20" y="100" class="label">Description:</text>
          <rect x="20" y="110" width="290" height="60" fill="#fff" stroke="#ccc"/>
          
          <rect x="20" y="180" width="12" height="12" fill="#fff" stroke="#333"/>
          <text x="40" y="190" class="label" font-size="10px">Include Logs &amp; System Info</text>
          
          <rect x="240" y="205" width="70" height="25" fill="#2196f3" rx="3"/>
          <text x="275" y="222" class="label" fill="#fff" text-anchor="middle">Send</text>
        
</svg>