<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .header-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .sidebar-bg { fill: #263238; }
      .sidebar-text { fill: #cfd8dc; font-family: Arial, sans-serif; font-size: 12px; }
      .sidebar-active { fill: #37474f; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>
  <rect width="700" height="500" class="bg" />
  
          <text x="10" y="20" class="title">Studio_LogViewer</text>
          <rect x="10" y="30" width="680" height="460" class="ctrl-bg" />
          
          <!-- Filters -->
          <g transform="translate(20, 40)">
             <text x="0" y="15" class="label">Level:</text>
             <rect x="40" y="0" width="80" height="20" fill="#fff" stroke="#ccc"/>
             <text x="45" y="14" class="label">All ▼</text>
             
             <text x="130" y="15" class="label">Search:</text>
             <rect x="180" y="0" width="200" height="20" fill="#fff" stroke="#ccc"/>
             <text x="185" y="14" class="label" fill="#ccc">Type to search...</text>
             
             <rect x="390" y="0" width="60" height="20" fill="#2196f3" rx="3"/>
             <text x="420" y="14" class="label" fill="#fff" text-anchor="middle">Refresh</text>
          </g>
          
          <!-- Log Grid -->
          <g transform="translate(20, 70)">
             <rect width="660" height="250" fill="#fff" stroke="#999"/>
             <!-- Header -->
             <rect width="660" height="20" class="header-bg"/>
             <text x="5" y="14" class="label" font-weight="bold">Time</text>
             <text x="120" y="14" class="label" font-weight="bold">Level</text>
             <text x="180" y="14" class="label" font-weight="bold">Source</text>
             <text x="300" y="14" class="label" font-weight="bold">Message</text>
             
             <!-- Row 1 Error -->
             <rect x="0" y="20" width="660" height="20" fill="#ffebee"/>
             <text x="5" y="34" class="label">10:00:01</text>
             <text x="120" y="34" class="label" fill="red">ERROR</text>
             <text x="180" y="34" class="label">DB</text>
             <text x="300" y="34" class="label">Connection failed</text>
             
             <!-- Row 2 Info -->
             <rect x="0" y="40" width="660" height="20" fill="#fff"/>
             <text x="5" y="54" class="label">10:00:05</text>
             <text x="120" y="54" class="label" fill="blue">INFO</text>
             <text x="180" y="54" class="label">App</text>
             <text x="300" y="54" class="label">Started successfully</text>
             
             <rect x="0" y="60" width="660" height="20" class="ctrl-active"/>
             <text x="5" y="74" class="label">10:01:20</text>
             <text x="120" y="74" class="label" fill="#ff9800">WARN</text>
             <text x="180" y="74" class="label">UI</text>
             <text x="300" y="74" class="label">High memory usage</text>
          </g>
          
          <!-- Detail View -->
          <text x="20" y="335" class="label" font-weight="bold">Details:</text>
          <rect x="20" y="340" width="660" height="140" fill="#fff" stroke="#999"/>
          <text x="25" y="355" class="label" font-family="monospace">Time: 2024-11-26 10:01:20</text>
          <text x="25" y="370" class="label" font-family="monospace">Level: WARN</text>
          <text x="25" y="385" class="label" font-family="monospace">Message: High memory usage (85%)</text>
          <text x="25" y="400" class="label" font-family="monospace">Stack Trace:</text>
          <text x="25" y="415" class="label" font-family="monospace" fill="#666">  at MainFrm.CheckMemory (Line 120)</text>
          <text x="25" y="430" class="label" font-family="monospace" fill="#666">  at Vcl.Forms.TApplication.Run</text>
        
</svg>