<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#357ABD"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA0E0"/>
      <stop offset="100%" style="stop-color:#4A90D9"/>
    </linearGradient>
  </defs>
  
  <!-- 背景遮罩 -->
  <rect width="480" height="360" fill="#00000040"/>
  
  <!-- 对话框主体 -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- 窗体背景 -->
    <rect x="0" y="0" width="400" height="300" rx="6" fill="#FFFFFF"/>
    
    <!-- 标题栏 -->
    <rect x="0" y="0" width="400" height="36" rx="6" fill="url(#headerGrad)"/>
    <rect x="0" y="30" width="400" height="6" fill="url(#headerGrad)"/>
    
    <!-- 标题图标 -->
    <g transform="translate(12, 8)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#FFFFFF30"/>
      <path d="M4 6h12M4 10h12M4 14h8" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    </g>
    
    <!-- 标题文字 -->
    <text x="40" y="24" font-family="Segoe UI, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">请输入内容</text>
    
    <!-- 窗口控制按钮 -->
    <g transform="translate(370, 10)">
      <!-- 关闭按钮 -->
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#FFFFFF20"/>
      <path d="M6 4l8 8M14 4l-8 8" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
    
    <!-- 提示标签 -->
    <text x="16" y="60" font-family="Segoe UI, sans-serif" font-size="12" fill="#333333">Prompt (提示信息):</text>
    
    <!-- 多行文本编辑框 -->
    <g transform="translate(16, 70)">
      <!-- 编辑框边框 -->
      <rect x="0" y="0" width="368" height="160" rx="4" fill="#FFFFFF" stroke="#C0C0C0" stroke-width="1"/>
      
      <!-- 输入区域（带模拟文字） -->
      <text x="8" y="20" font-family="Consolas, monospace" font-size="12" fill="#333333">这是一个可缩放的多行输入对话框。</text>
      <text x="8" y="38" font-family="Consolas, monospace" font-size="12" fill="#333333">用户可以在此输入多行文本内容。</text>
      <text x="8" y="56" font-family="Consolas, monospace" font-size="12" fill="#333333"></text>
      <text x="8" y="74" font-family="Consolas, monospace" font-size="12" fill="#333333">支持以下功能：</text>
      <text x="8" y="92" font-family="Consolas, monospace" font-size="12" fill="#333333">  • 自动换行</text>
      <text x="8" y="110" font-family="Consolas, monospace" font-size="12" fill="#333333">  • 滚动条</text>
      <text x="8" y="128" font-family="Consolas, monospace" font-size="12" fill="#333333">  • 窗体可拖拽缩放</text>
      
      <!-- 光标 -->
      <rect x="175" y="118" width="2" height="14" fill="#4A90D9">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      
      <!-- 垂直滚动条 -->
      <g transform="translate(352, 4)">
        <rect x="0" y="0" width="12" height="152" rx="2" fill="#F0F0F0"/>
        <rect x="2" y="2" width="8" height="40" rx="2" fill="#C0C0C0"/>
      </g>
    </g>
    
    <!-- 字数统计 -->
    <text x="16" y="248" font-family="Segoe UI, sans-serif" font-size="11" fill="#888888">字数: 89 / 2000</text>
    
    <!-- 窗体缩放指示器 -->
    <g transform="translate(380, 280)">
      <path d="M0 16L16 0M6 16L16 6M12 16L16 12" stroke="#C0C0C0" stroke-width="1.5"/>
    </g>
    
    <!-- 按钮区域 -->
    <g transform="translate(180, 258)">
      <!-- 确定按钮 -->
      <rect x="0" y="0" width="100" height="32" rx="4" fill="url(#btnPrimary)"/>
      <text x="50" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">确定</text>
      
      <!-- 取消按钮 -->
      <rect x="110" y="0" width="100" height="32" rx="4" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1"/>
      <text x="160" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#333333" text-anchor="middle">取消</text>
    </g>
  </g>
  
  <!-- 组件标注 -->
  <g transform="translate(10, 340)">
    <text font-family="Segoe UI, sans-serif" font-size="11" fill="#666666">
      <tspan x="0" font-weight="600">TInputDialog</tspan>
      <tspan x="85"> - 通用多行输入对话框 | 支持缩放 | 字数限制 | 可自定义标题和提示</tspan>
    </text>
  </g>
</svg>
