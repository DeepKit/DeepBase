<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .header-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .sidebar-bg { fill: #263238; }
      .sidebar-text { fill: #cfd8dc; font-family: Arial, sans-serif; font-size: 12px; }
      .sidebar-active { fill: #37474f; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>
  <rect width="600" height="400" class="bg" />
  
          <text x="10" y="20" class="title">Studio_LicenseManager</text>
          <rect x="10" y="30" width="580" height="360" class="ctrl-bg" />
          
          <!-- Tabs -->
          <rect x="20" y="40" width="100" height="25" fill="#fff" stroke="#999"/>
          <text x="70" y="57" class="label" text-anchor="middle">Generator</text>
          <rect x="120" y="40" width="100" height="25" fill="#eee" stroke="#999"/>
          <text x="170" y="57" class="label" text-anchor="middle" fill="#666">Validation</text>
          
          <!-- Generator Panel -->
          <rect x="20" y="65" width="560" height="315" fill="#fff" stroke="#999"/>
          
          <text x="40" y="90" class="label">Product:</text>
          <rect x="120" y="78" width="200" height="20" fill="#eee" stroke="#ccc"/>
          <text x="125" y="92" class="label">MyApp Pro</text>
          
          <text x="40" y="120" class="label">Type:</text>
          <rect x="120" y="108" width="150" height="20" fill="#fff" stroke="#ccc"/>
          <text x="125" y="122" class="label">Subscription (1 Year)</text>
          
          <text x="40" y="150" class="label">Customer:</text>
          <rect x="120" y="138" width="200" height="20" fill="#fff" stroke="#ccc"/>
          <text x="125" y="152" class="label">Acme Corp</text>
          
          <text x="40" y="180" class="label">Features:</text>
          <rect x="120" y="170" width="15" height="15" fill="#fff" stroke="#ccc"/> <text x="140" y="182" class="label">Advanced Reports</text>
          <rect x="260" y="170" width="15" height="15" fill="#2196f3" stroke="#ccc"/> <text x="280" y="182" class="label">Cloud Sync</text>
          
          <line x1="40" y1="210" x2="560" y2="210" stroke="#eee"/>
          
          <rect x="40" y="230" width="120" height="30" fill="#2196f3" rx="3"/>
          <text x="100" y="250" class="label" fill="#fff" text-anchor="middle">Generate Key</text>
          
          <text x="40" y="280" class="label">License Key:</text>
          <rect x="40" y="290" width="520" height="40" fill="#f5f5f5" stroke="#ccc" rx="3"/>
          <text x="300" y="315" class="label" text-anchor="middle" font-family="monospace" font-size="14px">XXXX-YYYY-ZZZZ-AAAA-BBBB</text>
        
</svg>