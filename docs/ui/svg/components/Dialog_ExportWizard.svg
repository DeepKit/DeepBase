<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #999; stroke-width: 1; }
      .ctrl-bg { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .ctrl-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1; }
      .header-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .sidebar-bg { fill: #263238; }
      .sidebar-text { fill: #cfd8dc; font-family: Arial, sans-serif; font-size: 12px; }
      .sidebar-active { fill: #37474f; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .hint { font-family: Arial, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>
  <rect width="400" height="300" class="bg" />
  
          <text x="10" y="20" class="title">Dialog_ExportWizard</text>
          <rect x="10" y="30" width="380" height="260" fill="#fff" stroke="#333" />
          
          <text x="20" y="50" class="title">Export Wizard</text>
          
          <text x="30" y="80" class="label" font-weight="bold">1. Select Data Source:</text>
          <rect x="30" y="90" width="340" height="80" fill="#f9f9f9" stroke="#ccc"/>
          
          <circle cx="50" cy="110" r="6" fill="#2196f3"/>
          <text x="70" y="114" class="label">i18n Translations</text>
          
          <circle cx="50" cy="135" r="6" fill="#fff" stroke="#666"/>
          <text x="70" y="139" class="label">Logs &amp; Exception Reports</text>
          
          <circle cx="50" cy="160" r="6" fill="#fff" stroke="#666"/>
          <text x="70" y="164" class="label">User Configuration</text>
          
          <text x="30" y="190" class="label" font-weight="bold">2. Format:</text>
          <rect x="100" y="180" width="100" height="20" fill="#fff" stroke="#ccc"/>
          <text x="110" y="194" class="label">JSON (*.json)</text>
          
          <!-- Buttons -->
          <line x1="10" y1="240" x2="390" y2="240" stroke="#eee"/>
          
          <rect x="220" y="250" width="70" height="25" fill="#eee" rx="3"/>
          <text x="255" y="267" class="label" text-anchor="middle">Cancel</text>
          
          <rect x="300" y="250" width="70" height="25" fill="#2196f3" rx="3"/>
          <text x="335" y="267" class="label" fill="#fff" text-anchor="middle">Next ></text>
        
</svg>