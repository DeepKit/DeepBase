<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <style>
      .bg { fill: #f9f9f9; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .mru-box { fill: #ffcccc; stroke: #cc0000; stroke-width: 2; }
      .i18n-box { fill: #ccffcc; stroke: #00cc00; stroke-width: 2; }
      .config-box { fill: #ffffcc; stroke: #ffcc00; stroke-width: 2; }
      .select-box { fill: #ccffff; stroke: #00cccc; stroke-width: 2; }
      .util-box { fill: #ffccff; stroke: #cc00cc; stroke-width: 2; }
      .base-box { fill: #e6e6e6; stroke: #999; stroke-width: 1; }
      .arrow { stroke: #333; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="1000" class="bg"/>

  <!-- 标题 -->
  <text x="700" y="40" class="title">UniBase UI 控件体系结构</text>
  <text x="700" y="65" class="subtitle">15 个控件 | VCL / FMX 双框架</text>

  <!-- MRU 控件 -->
  <g id="mru-section">
    <rect x="50" y="100" width="240" height="200" fill="#fff3f3" stroke="#ffcccc" stroke-width="2" rx="5"/>
    <text x="170" y="130" class="subtitle">MRU 控件（2 个）</text>
    
    <rect x="80" y="150" width="180" height="50" class="mru-box" rx="3"/>
    <text x="170" y="170" class="text" font-weight="bold">TMRUPopupMenu</text>
    <text x="170" y="185" class="text">最近文件菜单</text>
    
    <rect x="80" y="220" width="180" height="50" class="mru-box" rx="3"/>
    <text x="170" y="240" class="text" font-weight="bold">TMRUComboBox</text>
    <text x="170" y="255" class="text">历史组合框</text>
  </g>

  <!-- i18n 控件 -->
  <g id="i18n-section">
    <rect x="320" y="100" width="240" height="200" fill="#f3fff3" stroke="#ccffcc" stroke-width="2" rx="5"/>
    <text x="440" y="130" class="subtitle">i18n 控件（3 个）</text>
    
    <rect x="350" y="150" width="180" height="40" class="i18n-box" rx="3"/>
    <text x="440" y="170" class="text" font-weight="bold">TI18nLabel</text>
    <text x="440" y="183" class="text">自动翻译标签</text>
    
    <rect x="350" y="205" width="180" height="40" class="i18n-box" rx="3"/>
    <text x="440" y="225" class="text" font-weight="bold">TI18nButton</text>
    <text x="440" y="238" class="text">自动翻译按钮</text>
    
    <rect x="350" y="260" width="180" height="40" class="i18n-box" rx="3"/>
    <text x="440" y="280" class="text" font-weight="bold">TI18nMenuItem</text>
    <text x="440" y="293" class="text">自动翻译菜单项</text>
  </g>

  <!-- Config 控件 -->
  <g id="config-section">
    <rect x="590" y="100" width="240" height="200" fill="#fffff3" stroke="#ffffcc" stroke-width="2" rx="5"/>
    <text x="710" y="130" class="subtitle">Config 控件（3 个）</text>
    
    <rect x="620" y="150" width="180" height="40" class="config-box" rx="3"/>
    <text x="710" y="170" class="text" font-weight="bold">TConfigEdit</text>
    <text x="710" y="183" class="text">配置编辑框</text>
    
    <rect x="620" y="205" width="180" height="40" class="config-box" rx="3"/>
    <text x="710" y="225" class="text" font-weight="bold">TConfigCheckBox</text>
    <text x="710" y="238" class="text">配置复选框</text>
    
    <rect x="620" y="260" width="180" height="40" class="config-box" rx="3"/>
    <text x="710" y="280" class="text" font-weight="bold">TConfigSpinEdit</text>
    <text x="710" y="293" class="text">配置数值框</text>
  </g>

  <!-- Selection 控件 -->
  <g id="selection-section">
    <rect x="860" y="100" width="240" height="200" fill="#f3ffff" stroke="#ccffff" stroke-width="2" rx="5"/>
    <text x="980" y="130" class="subtitle">Selection 控件（2 个）</text>
    
    <rect x="890" y="150" width="180" height="50" class="select-box" rx="3"/>
    <text x="980" y="170" class="text" font-weight="bold">TLanguageComboBox</text>
    <text x="980" y="185" class="text">语言选择器</text>
    
    <rect x="890" y="220" width="180" height="50" class="select-box" rx="3"/>
    <text x="980" y="240" class="text" font-weight="bold">TThemeComboBox</text>
    <text x="980" y="255" class="text">主题选择器</text>
  </g>

  <!-- Utility 控件 -->
  <g id="utility-section">
    <rect x="1130" y="100" width="240" height="200" fill="#fff3ff" stroke="#ffccff" stroke-width="2" rx="5"/>
    <text x="1250" y="130" class="subtitle">Utility 控件（5 个）</text>
    
    <rect x="1160" y="150" width="180" height="30" class="util-box" rx="3"/>
    <text x="1250" y="168" class="text" font-weight="bold">TWaitForm</text>
    
    <rect x="1160" y="190" width="180" height="30" class="util-box" rx="3"/>
    <text x="1250" y="208" class="text" font-weight="bold">TAutoUpdater</text>
    
    <rect x="1160" y="230" width="180" height="30" class="util-box" rx="3"/>
    <text x="1250" y="248" class="text" font-weight="bold">TFeedbackDialog</text>
    
    <rect x="1160" y="270" width="180" height="30" class="util-box" rx="3"/>
    <text x="1250" y="288" class="text" font-weight="bold">TFormStateHelper</text>
  </g>

  <!-- 控件继承树（VCL 部分） -->
  <g id="vcl-inheritance">
    <text x="150" y="350" class="subtitle">VCL 继承树</text>
    
    <!-- 基类 -->
    <circle cx="150" cy="400" r="25" class="base-box"/>
    <text x="150" y="408" class="text" font-size="10" font-weight="bold">TComponent</text>
    
    <!-- 中间基类 -->
    <circle cx="80" cy="480" r="20" class="base-box"/>
    <text x="80" y="486" class="text" font-size="9">TPopupMenu</text>
    
    <circle cx="150" cy="480" r="20" class="base-box"/>
    <text x="150" y="486" class="text" font-size="9">TLabel</text>
    
    <circle cx="220" cy="480" r="20" class="base-box"/>
    <text x="220" y="486" class="text" font-size="9">TComboBox</text>
    
    <circle cx="290" cy="480" r="20" class="base-box"/>
    <text x="290" y="486" class="text" font-size="9">TEdit</text>
    
    <!-- 继承线 -->
    <line x1="150" y1="425" x2="80" y2="460" class="arrow" stroke-width="1"/>
    <line x1="150" y1="425" x2="150" y2="460" class="arrow" stroke-width="1"/>
    <line x1="150" y1="425" x2="220" y2="460" class="arrow" stroke-width="1"/>
    <line x1="150" y1="425" x2="290" y2="460" class="arrow" stroke-width="1"/>
    
    <!-- 派生控件 -->
    <rect x="45" y="520" width="70" height="30" class="mru-box" rx="2"/>
    <text x="80" y="540" class="text" font-size="10">TMRUPopupMenu</text>
    
    <rect x="115" y="520" width="70" height="30" class="i18n-box" rx="2"/>
    <text x="150" y="540" class="text" font-size="10">TI18nLabel</text>
    
    <rect x="185" y="520" width="70" height="30" class="select-box" rx="2"/>
    <text x="220" y="540" class="text" font-size="10">TLanguageCombo</text>
    
    <rect x="255" y="520" width="70" height="30" class="config-box" rx="2"/>
    <text x="290" y="540" class="text" font-size="10">TConfigEdit</text>
    
    <!-- 派生线 -->
    <line x1="80" y1="500" x2="80" y2="520" class="arrow" stroke-width="1"/>
    <line x1="150" y1="500" x2="150" y2="520" class="arrow" stroke-width="1"/>
    <line x1="220" y1="500" x2="220" y2="520" class="arrow" stroke-width="1"/>
    <line x1="290" y1="500" x2="290" y2="520" class="arrow" stroke-width="1"/>
  </g>

  <!-- 控件功能矩阵 -->
  <g id="function-matrix">
    <text x="700" y="350" class="subtitle">控件功能映射</text>
    
    <rect x="550" y="370" width="300" height="200" fill="white" stroke="#999" stroke-width="1" rx="3"/>
    
    <!-- 表头 -->
    <rect x="550" y="370" width="100" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="600" y="390" class="text" font-size="11" font-weight="bold">功能</text>
    
    <rect x="650" y="370" width="100" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="700" y="390" class="text" font-size="11" font-weight="bold">控件数</text>
    
    <rect x="750" y="370" width="100" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="800" y="390" class="text" font-size="11" font-weight="bold">示例</text>
    
    <!-- 数据行 -->
    <line x1="550" y1="400" x2="850" y2="400" stroke="#ccc" stroke-width="1"/>
    <text x="600" y="415" class="text" font-size="10">MRU 管理</text>
    <text x="700" y="415" class="text" font-size="10">2</text>
    <text x="800" y="415" class="text" font-size="10">Popup/Combo</text>
    
    <line x1="550" y1="430" x2="850" y2="430" stroke="#ccc" stroke-width="1"/>
    <text x="600" y="445" class="text" font-size="10">国际化</text>
    <text x="700" y="445" class="text" font-size="10">3</text>
    <text x="800" y="445" class="text" font-size="10">Label/Button/Menu</text>
    
    <line x1="550" y1="460" x2="850" y2="460" stroke="#ccc" stroke-width="1"/>
    <text x="600" y="475" class="text" font-size="10">配置绑定</text>
    <text x="700" y="475" class="text" font-size="10">3</text>
    <text x="800" y="475" class="text" font-size="10">Edit/CheckBox/Spin</text>
    
    <line x1="550" y1="490" x2="850" y2="490" stroke="#ccc" stroke-width="1"/>
    <text x="600" y="505" class="text" font-size="10">选择器</text>
    <text x="700" y="505" class="text" font-size="10">2</text>
    <text x="800" y="505" class="text" font-size="10">Language/Theme</text>
    
    <line x1="550" y1="520" x2="850" y2="520" stroke="#ccc" stroke-width="1"/>
    <text x="600" y="535" class="text" font-size="10">工具类</text>
    <text x="700" y="535" class="text" font-size="10">5</text>
    <text x="800" y="535" class="text" font-size="10">多种用途</text>
    
    <line x1="550" y1="550" x2="850" y2="550" stroke="#ccc" stroke-width="1"/>
    <text x="600" y="565" class="text" font-size="10" font-weight="bold">总计</text>
    <text x="700" y="565" class="text" font-size="10" font-weight="bold">15</text>
    <text x="800" y="565" class="text" font-size="10" font-weight="bold">VCL+FMX</text>
  </g>

  <!-- 数据流图 -->
  <g id="data-flow">
    <text x="150" y="650" class="subtitle">数据流示例：TI18nLabel</text>
    
    <!-- 应用程序 -->
    <rect x="50" y="680" width="80" height="40" class="mru-box" rx="3"/>
    <text x="90" y="705" class="text" font-size="11">应用程序</text>
    
    <!-- 箭头 -->
    <line x1="130" y1="700" x2="180" y2="700" marker-end="url(#arrowhead)" class="arrow" stroke-width="1"/>
    <text x="155" y="695" class="text" font-size="9">设置 TextKey</text>
    
    <!-- TI18nLabel -->
    <rect x="180" y="680" width="80" height="40" class="i18n-box" rx="3"/>
    <text x="220" y="705" class="text" font-size="11">TI18nLabel</text>
    
    <!-- 箭头 -->
    <line x1="260" y1="700" x2="310" y2="700" marker-end="url(#arrowhead)" class="arrow" stroke-width="1"/>
    <text x="280" y="695" class="text" font-size="9">T() 函数</text>
    
    <!-- Manager -->
    <rect x="310" y="680" width="80" height="40" class="mru-box" rx="3"/>
    <text x="350" y="705" class="text" font-size="11">Manager</text>
    
    <!-- 箭头 -->
    <line x1="390" y1="700" x2="440" y2="700" marker-end="url(#arrowhead)" class="arrow" stroke-width="1"/>
    <text x="410" y="695" class="text" font-size="9">查询</text>
    
    <!-- Database -->
    <rect x="440" y="680" width="80" height="40" class="select-box" rx="3"/>
    <text x="480" y="705" class="text" font-size="11">数据库</text>
    
    <!-- 返回 -->
    <path d="M 480 720 L 480 750 L 220 750 L 220 720" fill="none" class="arrow" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="320" y="745" class="text" font-size="9">返回译文</text>
  </g>

  <!-- VCL 与 FMX 对比 -->
  <g id="vcl-fmx-compare">
    <text x="900" y="650" class="subtitle">VCL vs FMX 兼容性</text>
    
    <rect x="800" y="670" width="200" height="80" fill="#fff3f3" stroke="#ffcccc" stroke-width="2" rx="3"/>
    <text x="900" y="690" class="text" font-weight="bold">VCL 特点</text>
    <text x="900" y="710" class="text" font-size="10">✓ 桌面原生控件</text>
    <text x="900" y="725" class="text" font-size="10">✓ 性能最优</text>
    <text x="900" y="740" class="text" font-size="10">✓ Windows 专用</text>
    
    <rect x="1050" y="670" width="200" height="80" fill="#f3f3ff" stroke="#ccccff" stroke-width="2" rx="3"/>
    <text x="1150" y="690" class="text" font-weight="bold">FMX 特点</text>
    <text x="1150" y="710" class="text" font-size="10">✓ 跨平台编译</text>
    <text x="1150" y="725" class="text" font-size="10">✓ 统一 API</text>
    <text x="1150" y="740" class="text" font-size="10">✓ iOS/Android 支持</text>
    
    <text x="1050" y="800" class="text" font-size="10" font-weight="bold">两者 API 完全兼容，支持相同的 15 个控件</text>
  </g>

  <!-- 控件生命周期 -->
  <g id="lifecycle">
    <text x="150" y="850" class="subtitle">控件生命周期示例</text>
    
    <rect x="50" y="870" width="70" height="35" fill="#e6e6e6" stroke="#333" stroke-width="1" rx="2"/>
    <text x="85" y="895" class="text" font-size="9" font-weight="bold">设计时</text>
    
    <line x1="120" y1="887" x2="160" y2="887" marker-end="url(#arrowhead)" class="arrow" stroke-width="1"/>
    
    <rect x="160" y="870" width="70" height="35" fill="#e6e6e6" stroke="#333" stroke-width="1" rx="2"/>
    <text x="195" y="895" class="text" font-size="9" font-weight="bold">编译时</text>
    
    <line x1="230" y1="887" x2="270" y2="887" marker-end="url(#arrowhead)" class="arrow" stroke-width="1"/>
    
    <rect x="270" y="870" width="70" height="35" fill="#e6e6e6" stroke="#333" stroke-width="1" rx="2"/>
    <text x="305" y="895" class="text" font-size="9" font-weight="bold">运行时</text>
    
    <line x1="340" y1="887" x2="380" y2="887" marker-end="url(#arrowhead)" class="arrow" stroke-width="1"/>
    
    <rect x="380" y="870" width="70" height="35" fill="#e6e6e6" stroke="#333" stroke-width="1" rx="2"/>
    <text x="415" y="895" class="text" font-size="9" font-weight="bold">销毁</text>
    
    <!-- 说明文字 -->
    <text x="85" y="930" class="text" font-size="10">在 IDE 中</text>
    <text x="195" y="930" class="text" font-size="10">编译进包</text>
    <text x="305" y="930" class="text" font-size="10">初始化+绑定</text>
    <text x="415" y="930" class="text" font-size="10">保存状态</text>
  </g>

  <!-- 图例 -->
  <g id="legend">
    <text x="50" y="975" class="text" font-size="11" font-weight="bold">图例：</text>
    
    <rect x="150" y="965" width="12" height="12" class="mru-box"/>
    <text x="170" y="973" class="text" font-size="10">MRU 控件</text>
    
    <rect x="280" y="965" width="12" height="12" class="i18n-box"/>
    <text x="300" y="973" class="text" font-size="10">i18n 控件</text>
    
    <rect x="410" y="965" width="12" height="12" class="config-box"/>
    <text x="430" y="973" class="text" font-size="10">Config 控件</text>
    
    <rect x="540" y="965" width="12" height="12" class="select-box"/>
    <text x="560" y="973" class="text" font-size="10">Selection 控件</text>
    
    <rect x="700" y="965" width="12" height="12" class="util-box"/>
    <text x="720" y="973" class="text" font-size="10">Utility 控件</text>
    
    <rect x="850" y="965" width="12" height="12" class="base-box"/>
    <text x="870" y="973" class="text" font-size="10">基类</text>
  </g>
</svg>
