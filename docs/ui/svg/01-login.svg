<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Login Card -->
  <rect x="30" y="60" width="340" height="380" rx="12" fill="white" filter="url(#shadow)"/>
  
  <!-- Logo/Title Area -->
  <circle cx="200" cy="110" r="30" fill="#667eea"/>
  <text x="200" y="118" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold">U</text>
  <text x="200" y="165" text-anchor="middle" fill="#333" font-family="Arial" font-size="20" font-weight="bold">登录 UniBase</text>
  <text x="200" y="185" text-anchor="middle" fill="#666" font-family="Arial" font-size="12">请输入您的账户信息</text>
  
  <!-- Email/Username Field -->
  <text x="55" y="220" fill="#333" font-family="Arial" font-size="13" font-weight="500">邮箱 / 用户名</text>
  <rect x="50" y="228" width="300" height="42" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="254" fill="#999" font-family="Arial" font-size="14">请输入邮箱或用户名</text>
  
  <!-- Password Field -->
  <text x="55" y="290" fill="#333" font-family="Arial" font-size="13" font-weight="500">密码</text>
  <rect x="50" y="298" width="300" height="42" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="324" fill="#999" font-family="Arial" font-size="14">请输入密码</text>
  <!-- Eye icon for show/hide password -->
  <circle cx="330" cy="319" r="10" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="330" cy="319" r="4" fill="#999"/>
  
  <!-- Remember Me & Forgot Password -->
  <rect x="50" y="355" width="16" height="16" rx="3" fill="none" stroke="#667eea" stroke-width="1.5"/>
  <text x="72" y="367" fill="#555" font-family="Arial" font-size="12">记住我</text>
  <text x="350" y="367" text-anchor="end" fill="#667eea" font-family="Arial" font-size="12" style="cursor:pointer">忘记密码?</text>
  
  <!-- Login Button -->
  <rect x="50" y="385" width="300" height="44" rx="6" fill="#667eea"/>
  <text x="200" y="413" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="bold">登 录</text>
  
  <!-- Register Link -->
  <text x="200" y="455" text-anchor="middle" fill="white" font-family="Arial" font-size="13">
    还没有账号? <tspan fill="#fff" font-weight="bold" text-decoration="underline">立即注册</tspan>
  </text>
  
  <!-- Annotations -->
  <rect x="365" y="228" width="30" height="20" rx="3" fill="#ff6b6b" opacity="0.9"/>
  <text x="380" y="242" text-anchor="middle" fill="white" font-family="Arial" font-size="9">必填</text>
  
  <rect x="365" y="298" width="30" height="20" rx="3" fill="#ff6b6b" opacity="0.9"/>
  <text x="380" y="312" text-anchor="middle" fill="white" font-family="Arial" font-size="9">必填</text>
</svg>
