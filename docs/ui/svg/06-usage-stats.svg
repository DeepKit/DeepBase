<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="800" height="60" fill="white" filter="url(#shadow6)"/>
  <text x="30" y="38" fill="#333" font-family="Arial" font-size="18" font-weight="bold">用量统计</text>
  
  <!-- Date Range Selector -->
  <rect x="580" y="18" width="200" height="32" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="600" y="39" fill="#333" font-family="Arial" font-size="12">2024-12-01 至 2024-12-14</text>
  <text x="765" y="39" fill="#667eea" font-family="Arial" font-size="12">▼</text>
  
  <!-- Summary Cards Row -->
  <rect x="20" y="80" width="180" height="90" rx="10" fill="white" filter="url(#shadow6)"/>
  <text x="40" y="110" fill="#999" font-family="Arial" font-size="12">总调用次数</text>
  <text x="40" y="145" fill="#333" font-family="Arial" font-size="28" font-weight="bold">12,456</text>
  <text x="170" y="145" text-anchor="end" fill="#4caf50" font-family="Arial" font-size="11">↑ 15%</text>
  
  <rect x="215" y="80" width="180" height="90" rx="10" fill="white" filter="url(#shadow6)"/>
  <text x="235" y="110" fill="#999" font-family="Arial" font-size="12">输入Token</text>
  <text x="235" y="145" fill="#333" font-family="Arial" font-size="28" font-weight="bold">2.5M</text>
  <text x="365" y="145" text-anchor="end" fill="#4caf50" font-family="Arial" font-size="11">↑ 8%</text>
  
  <rect x="410" y="80" width="180" height="90" rx="10" fill="white" filter="url(#shadow6)"/>
  <text x="430" y="110" fill="#999" font-family="Arial" font-size="12">输出Token</text>
  <text x="430" y="145" fill="#333" font-family="Arial" font-size="28" font-weight="bold">890K</text>
  <text x="560" y="145" text-anchor="end" fill="#ff5252" font-family="Arial" font-size="11">↓ 3%</text>
  
  <rect x="605" y="80" width="175" height="90" rx="10" fill="white" filter="url(#shadow6)"/>
  <text x="625" y="110" fill="#999" font-family="Arial" font-size="12">总消费</text>
  <text x="625" y="145" fill="#333" font-family="Arial" font-size="28" font-weight="bold">¥156.80</text>
  
  <!-- Chart Area -->
