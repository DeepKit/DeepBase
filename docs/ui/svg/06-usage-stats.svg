  <text x="40" y="225" fill="#333" font-family="Arial" font-size="16" font-weight="bold">调用趋势</text>
  
  <!-- Tab Selector -->
  <rect x="200" y="208" width="50" height="24" rx="12" fill="#667eea"/>
  <text x="225" y="224" text-anchor="middle" fill="white" font-family="Arial" font-size="11">日</text>
  <rect x="255" y="208" width="50" height="24" rx="12" fill="#f5f5f5"/>
  <text x="280" y="224" text-anchor="middle" fill="#666" font-family="Arial" font-size="11">周</text>
  <rect x="310" y="208" width="50" height="24" rx="12" fill="#f5f5f5"/>
  <text x="335" y="224" text-anchor="middle" fill="#666" font-family="Arial" font-size="11">月</text>
  
  <!-- Chart Grid -->
  <line x1="60" y1="260" x2="60" y2="440" stroke="#eee"/>
  <line x1="60" y1="440" x2="490" y2="440" stroke="#eee"/>
  
  <!-- Y Axis Labels -->
  <text x="50" y="270" text-anchor="end" fill="#999" font-family="Arial" font-size="10">2000</text>
  <text x="50" y="310" text-anchor="end" fill="#999" font-family="Arial" font-size="10">1500</text>
  <text x="50" y="350" text-anchor="end" fill="#999" font-family="Arial" font-size="10">1000</text>
  <text x="50" y="390" text-anchor="end" fill="#999" font-family="Arial" font-size="10">500</text>
  <text x="50" y="440" text-anchor="end" fill="#999" font-family="Arial" font-size="10">0</text>
  
  <!-- Grid Lines -->
  <line x1="60" y1="265" x2="490" y2="265" stroke="#f5f5f5"/>
  <line x1="60" y1="305" x2="490" y2="305" stroke="#f5f5f5"/>
  <line x1="60" y1="345" x2="490" y2="345" stroke="#f5f5f5"/>
  <line x1="60" y1="385" x2="490" y2="385" stroke="#f5f5f5"/>
  
