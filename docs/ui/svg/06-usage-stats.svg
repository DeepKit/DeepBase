  <rect x="120" y="310" width="25" height="130" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="160" y="290" width="25" height="150" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="200" y="320" width="25" height="120" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="240" y="280" width="25" height="160" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="280" y="300" width="25" height="140" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="320" y="270" width="25" height="170" rx="3" fill="#667eea"/>
  <rect x="360" y="310" width="25" height="130" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="400" y="330" width="25" height="110" rx="3" fill="#667eea" opacity="0.8"/>
  <rect x="440" y="350" width="25" height="90" rx="3" fill="#667eea" opacity="0.8"/>
  
  <!-- X Axis Labels -->
  <text x="93" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/5</text>
  <text x="133" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/6</text>
  <text x="173" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/7</text>
  <text x="213" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/8</text>
  <text x="253" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/9</text>
  <text x="293" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/10</text>
  <text x="333" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/11</text>
  <text x="373" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/12</text>
  <text x="413" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/13</text>
  <text x="453" y="455" text-anchor="middle" fill="#999" font-family="Arial" font-size="10">12/14</text>
  
  <!-- Model Usage Breakdown -->
  <rect x="540" y="190" width="240" height="280" rx="10" fill="white" filter="url(#shadow6)"/>
  <text x="560" y="225" fill="#333" font-family="Arial" font-size="16" font-weight="bold">模型使用分布</text>
  
  <!-- Pie Chart (simplified representation) -->
  <circle cx="660" cy="320" r="60" fill="none" stroke="#667eea" stroke-width="15" stroke-dasharray="188 188" stroke-dashoffset="0"/>
  <circle cx="660" cy="320" r="60" fill="none" stroke="#4ecdc4" stroke-width="15" stroke-dasharray="94 282" stroke-dashoffset="-188"/>
  <circle cx="660" cy="320" r="60" fill="none" stroke="#ff6b6b" stroke-width="15" stroke-dasharray="47 329" stroke-dashoffset="-282"/>
  <circle cx="660" cy="320" r="60" fill="none" stroke="#ffd93d" stroke-width="15" stroke-dasharray="47 329" stroke-dashoffset="-329"/>
  
  <!-- Legend -->
  <rect x="560" y="400" width="12" height="12" rx="2" fill="#667eea"/>
  <text x="580" y="410" fill="#333" font-family="Arial" font-size="11">GPT-4 (50%)</text>
  
  <rect x="560" y="420" width="12" height="12" rx="2" fill="#4ecdc4"/>
  <text x="580" y="430" fill="#333" font-family="Arial" font-size="11">GPT-3.5 (25%)</text>
  
  <rect x="560" y="440" width="12" height="12" rx="2" fill="#ff6b6b"/>
  <text x="580" y="450" fill="#333" font-family="Arial" font-size="11">Claude-3 (12.5%)</text>
  
  <rect x="560" y="460" width="12" height="12" rx="2" fill="#ffd93d"/>
  <text x="580" y="470" fill="#333" font-family="Arial" font-size="11">其他 (12.5%)</text>
  
  <!-- Recent Calls Table -->
  <rect x="20" y="490" width="760" height="90" rx="10" fill="white" filter="url(#shadow6)"/>
  <text x="40" y="520" fill="#333" font-family="Arial" font-size="14" font-weight="bold">最近调用</text>
  <text x="760" y="520" text-anchor="end" fill="#667eea" font-family="Arial" font-size="12">查看详情</text>
  
  <!-- Table Header -->
  <text x="40" y="550" fill="#999" font-family="Arial" font-size="11">时间</text>
  <text x="180" y="550" fill="#999" font-family="Arial" font-size="11">模型</text>
  <text x="320" y="550" fill="#999" font-family="Arial" font-size="11">输入Token</text>
  <text x="440" y="550" fill="#999" font-family="Arial" font-size="11">输出Token</text>
  <text x="560" y="550" fill="#999" font-family="Arial" font-size="11">耗时</text>
  <text x="680" y="550" fill="#999" font-family="Arial" font-size="11">费用</text>
  
  <!-- Table Row -->
  <text x="40" y="572" fill="#333" font-family="Arial" font-size="12">14:30:25</text>
  <text x="180" y="572" fill="#333" font-family="Arial" font-size="12">GPT-4</text>
  <text x="320" y="572" fill="#333" font-family="Arial" font-size="12">1,234</text>
  <text x="440" y="572" fill="#333" font-family="Arial" font-size="12">456</text>
  <text x="560" y="572" fill="#333" font-family="Arial" font-size="12">2.3s</text>
  <text x="680" y="572" fill="#333" font-family="Arial" font-size="12">¥0.12</text>
