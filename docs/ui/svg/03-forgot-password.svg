<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="450" fill="url(#bgGrad3)"/>
  
  <!-- Card -->
  <rect x="30" y="50" width="340" height="350" rx="12" fill="white" filter="url(#shadow3)"/>
  
  <!-- Back Arrow -->
  <text x="55" y="82" fill="#667eea" font-family="Arial" font-size="20">←</text>
  <text x="80" y="82" fill="#667eea" font-family="Arial" font-size="14">返回登录</text>
  
  <!-- Lock Icon -->
  <circle cx="200" cy="130" r="35" fill="#fff3e0"/>
  <rect x="185" y="120" width="30" height="25" rx="4" fill="none" stroke="#ff9800" stroke-width="2.5"/>
  <path d="M192 120 L192 110 Q192 100 200 100 Q208 100 208 110 L208 120" fill="none" stroke="#ff9800" stroke-width="2.5"/>
  <circle cx="200" cy="132" r="3" fill="#ff9800"/>
  
  <!-- Title -->
  <text x="200" y="190" text-anchor="middle" fill="#333" font-family="Arial" font-size="20" font-weight="bold">找回密码</text>
  <text x="200" y="215" text-anchor="middle" fill="#666" font-family="Arial" font-size="12">请输入您的注册邮箱，我们将发送重置链接</text>
  
  <!-- Email Field -->
  <text x="55" y="250" fill="#333" font-family="Arial" font-size="13" font-weight="500">邮箱地址</text>
  <rect x="50" y="258" width="300" height="42" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="284" fill="#999" font-family="Arial" font-size="14">请输入注册时使用的邮箱</text>
  
  <!-- Send Button -->
  <rect x="50" y="320" width="300" height="44" rx="6" fill="#667eea"/>
  <text x="200" y="348" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="bold">发送重置链接</text>
  
  <!-- Help Text -->
  <text x="200" y="390" text-anchor="middle" fill="#999" font-family="Arial" font-size="11">
    没有收到邮件? 请检查垃圾邮件文件夹
  </text>
  
  <!-- Contact Support -->
  <text x="200" y="410" text-anchor="middle" fill="#667eea" font-family="Arial" font-size="12">
    联系客服
  </text>
</svg>
