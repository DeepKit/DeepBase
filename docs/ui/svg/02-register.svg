<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad2)"/>
  
  <!-- Register Card -->
  <rect x="30" y="40" width="340" height="520" rx="12" fill="white" filter="url(#shadow2)"/>
  
  <!-- Title Area -->
  <circle cx="200" cy="85" r="28" fill="#667eea"/>
  <text x="200" y="92" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">+</text>
  <text x="200" y="135" text-anchor="middle" fill="#333" font-family="Arial" font-size="20" font-weight="bold">创建账户</text>
  <text x="200" y="155" text-anchor="middle" fill="#666" font-family="Arial" font-size="12">填写以下信息完成注册</text>
  
  <!-- Username Field -->
  <text x="55" y="185" fill="#333" font-family="Arial" font-size="12" font-weight="500">用户名</text>
  <rect x="50" y="192" width="300" height="38" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="216" fill="#999" font-family="Arial" font-size="13">3-20个字符，字母数字下划线</text>
  
  <!-- Email Field -->
  <text x="55" y="248" fill="#333" font-family="Arial" font-size="12" font-weight="500">邮箱地址</text>
  <rect x="50" y="255" width="300" height="38" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="279" fill="#999" font-family="Arial" font-size="13">用于验证和找回密码</text>
  
  <!-- Password Field -->
  <text x="55" y="311" fill="#333" font-family="Arial" font-size="12" font-weight="500">密码</text>
  <rect x="50" y="318" width="300" height="38" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="342" fill="#999" font-family="Arial" font-size="13">至少8位，包含字母和数字</text>
  
  <!-- Password Strength Indicator -->
  <rect x="50" y="360" width="100" height="3" rx="1" fill="#ddd"/>
  <rect x="150" y="360" width="100" height="3" rx="1" fill="#ddd"/>
  <rect x="250" y="360" width="100" height="3" rx="1" fill="#ddd"/>
  <text x="350" y="370" text-anchor="end" fill="#999" font-family="Arial" font-size="10">密码强度</text>
  
  <!-- Confirm Password Field -->
  <text x="55" y="390" fill="#333" font-family="Arial" font-size="12" font-weight="500">确认密码</text>
  <rect x="50" y="397" width="300" height="38" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="65" y="421" fill="#999" font-family="Arial" font-size="13">请再次输入密码</text>
  
  <!-- Terms Checkbox -->
  <rect x="50" y="450" width="16" height="16" rx="3" fill="none" stroke="#667eea" stroke-width="1.5"/>
  <text x="72" y="462" fill="#555" font-family="Arial" font-size="11">
    我已阅读并同意 <tspan fill="#667eea">服务条款</tspan> 和 <tspan fill="#667eea">隐私政策</tspan>
  </text>
  
  <!-- Register Button -->
  <rect x="50" y="480" width="300" height="42" rx="6" fill="#667eea"/>
  <text x="200" y="507" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="bold">注 册</text>
  
  <!-- Login Link -->
  <text x="200" y="545" text-anchor="middle" fill="#666" font-family="Arial" font-size="13">
    已有账号? <tspan fill="#667eea" font-weight="bold">立即登录</tspan>
  </text>
  
  <!-- Required Indicators -->
  <text x="350" y="185" text-anchor="end" fill="#ff6b6b" font-family="Arial" font-size="10">*必填</text>
  <text x="350" y="248" text-anchor="end" fill="#ff6b6b" font-family="Arial" font-size="10">*必填</text>
  <text x="350" y="311" text-anchor="end" fill="#ff6b6b" font-family="Arial" font-size="10">*必填</text>
  <text x="350" y="390" text-anchor="end" fill="#ff6b6b" font-family="Arial" font-size="10">*必填</text>
</svg>
