        <text x="16" y="58" fill="#B8A995" font-size="11">1</text>
        <text x="46" y="58" fill="#FDFCF8" font-size="11" font-weight="700">东方明珠置业 (上海)</text>
        <text x="240" y="58" fill="#FDFCF8" font-size="11">139-8877-6655</text>
        <text x="380" y="58" fill="#FDFCF8" font-size="11">¥ 248,500.00</text>
