        <text x="16" y="28" fill="#B8A995" font-size="12" font-weight="700">📂 分面分类 (42)</text>
        
        <!-- Facet item 1 -->
        <rect x="12" y="44" width="186" height="36" rx="4" fill="#1C1914" stroke="#3D352A" stroke-width="1" />
        <text x="22" y="66" fill="#FDFCF8" font-size="11">⚖️ 7字段法源 (14)</text>
        <rect x="144" y="52" width="46" height="20" rx="3" fill="#EF4444" fill-opacity="0.15" />
        <text x="150" y="66" fill="#EF4444" font-size="10">🚫 排除</text>

