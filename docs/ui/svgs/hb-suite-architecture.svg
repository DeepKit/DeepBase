        <text x="46" y="100" fill="#FDFCF8" font-size="11" font-weight="700">环球金融科技有限公司</text>
        <text x="240" y="100" fill="#FDFCF8" font-size="11">138-0011-2233</text>
        <text x="380" y="100" fill="#FDFCF8" font-size="11">¥ 180,000.00</text>
        <text x="490" y="94" fill="#FBBF24" font-size="10">78%</text>
