<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .title { font: bold 20px "Microsoft YaHei", sans-serif; fill: #1a1a2e; }
      .subtitle { font: 14px "Microsoft YaHei", sans-serif; fill: #666; }
      .label { font: 12px "Microsoft YaHei", sans-serif; fill: #333; }
      .small { font: 10px "Microsoft YaHei", sans-serif; fill: #666; }
      .hint { font: italic 11px "Microsoft YaHei", sans-serif; fill: #999; }
      .panel { fill: #fff; stroke: #e0e0e0; stroke-width: 1; }
      .panel-header { fill: #f8f9fa; }
      .input-area { fill: #fafafa; stroke: #ddd; rx: 4; }
      .button { fill: #4a6cf7; rx: 4; }
      .button-text { font: bold 12px "Microsoft YaHei", sans-serif; fill: #fff; }
      .button-secondary { fill: #f0f0f0; stroke: #ccc; rx: 4; }
      .button-secondary-text { font: 12px "Microsoft YaHei", sans-serif; fill: #333; }
      .option-btn { fill: #fff; stroke: #4a6cf7; rx: 6; cursor: pointer; }
      .option-btn-selected { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 6; }
      .option-btn-text { font: 12px "Microsoft YaHei", sans-serif; fill: #4a6cf7; }
      .option-group { fill: #fafafa; stroke: #e0e0e0; rx: 8; }
      .message-user { fill: #e3f2fd; rx: 8; }
      .canvas-bg { fill: #fefefe; stroke: #e8e8e8; }
      .sketch-element { fill: none; stroke: #666; stroke-width: 1.5; stroke-dasharray: 4,2; }
      .node-item { fill: #fff; stroke: #ddd; rx: 4; }
      .node-active { fill: #e8f5e9; stroke: #4caf50; rx: 4; }
      .divider { stroke: #e0e0e0; stroke-width: 1; }
      .section-title { font: bold 11px "Microsoft YaHei", sans-serif; fill: #666; }
      .chip { rx: 12; }
      .chip-selected { fill: #4a6cf7; }
      .chip-unselected { fill: #fff; stroke: #ccc; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="#f5f6fa"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1200" height="50" fill="#1a1a2e"/>
  <text x="20" y="32" class="title" fill="#fff">如是 SoIs</text>
  <text x="120" y="32" class="subtitle" fill="#aaa">— 言出即是</text>
  
  <!-- 项目名称 -->
  <text x="600" y="32" class="label" fill="#fff" text-anchor="middle">📁 AI辅导孩子作业</text>
  
  <!-- 右上角状态 -->
  <text x="1100" y="32" class="small" fill="#8f8">● Loop A · 构建中</text>

  <!-- 左侧：澄清面板 (400px) - 点选式 -->
  <rect x="10" y="60" width="380" height="730" class="panel" rx="8"/>
  
  <!-- 澄清面板标题 -->
  <rect x="10" y="60" width="380" height="40" class="panel-header" rx="8"/>
  <text x="30" y="85" class="label" font-weight="bold">📋 需求澄清</text>
  <text x="340" y="85" class="small">3/5 已确认</text>

  <!-- 用户原始需求（只读展示） -->
  <rect x="20" y="110" width="360" height="50" class="message-user"/>
  <text x="35" y="130" class="small" font-weight="bold">💬 你的需求：</text>
  <text x="35" y="148" class="small">我想做一个软件，用AI辅导孩子做作业，主要是数学和语文</text>

  <!-- 分隔线 -->
  <line x1="20" y1="170" x2="380" y2="170" class="divider"/>

  <!-- 澄清选项区域 -->
  <!-- 选项1：年级 -->
  <rect x="20" y="180" width="360" height="70" class="option-group"/>
  <text x="35" y="200" class="section-title">1. 目标年级</text>
  
  <rect x="30" y="210" width="60" height="30" class="option-btn-selected"/>
  <text x="60" y="230" class="option-btn-text" text-anchor="middle" fill="#1976d2" font-weight="bold">小学</text>
  
  <rect x="100" y="210" width="60" height="30" class="option-btn"/>
  <text x="130" y="230" class="option-btn-text" text-anchor="middle">初中</text>
  
  <rect x="170" y="210" width="60" height="30" class="option-btn"/>
  <text x="200" y="230" class="option-btn-text" text-anchor="middle">高中</text>
  
  <text x="350" y="230" class="small" fill="#4caf50">✓</text>

  <!-- 选项2：科目 -->
  <rect x="20" y="260" width="360" height="70" class="option-group"/>
  <text x="35" y="280" class="section-title">2. 辅导科目（可多选）</text>
  
  <rect x="30" y="290" width="50" height="28" class="chip chip-selected"/>
  <text x="55" y="309" class="small" fill="#fff" text-anchor="middle">数学</text>
  
  <rect x="90" y="290" width="50" height="28" class="chip chip-selected"/>
  <text x="115" y="309" class="small" fill="#fff" text-anchor="middle">语文</text>
  
  <rect x="150" y="290" width="50" height="28" class="chip chip-unselected"/>
  <text x="175" y="309" class="small" text-anchor="middle">英语</text>
  
  <rect x="210" y="290" width="50" height="28" class="chip chip-unselected"/>
  <text x="235" y="309" class="small" text-anchor="middle">物理</text>
  
  <rect x="270" y="290" width="50" height="28" class="chip chip-unselected"/>
  <text x="295" y="309" class="small" text-anchor="middle">化学</text>
  
  <text x="350" y="309" class="small" fill="#4caf50">✓</text>

  <!-- 选项3：拍照功能 -->
  <rect x="20" y="340" width="360" height="70" class="option-group"/>
  <text x="35" y="360" class="section-title">3. 需要拍照识题吗？</text>
  
  <rect x="30" y="370" width="100" height="30" class="option-btn-selected"/>
  <text x="80" y="390" class="option-btn-text" text-anchor="middle" fill="#1976d2" font-weight="bold">📷 需要</text>
  
  <rect x="140" y="370" width="100" height="30" class="option-btn"/>
  <text x="190" y="390" class="option-btn-text" text-anchor="middle">手动输入即可</text>
  
  <text x="350" y="390" class="small" fill="#4caf50">✓</text>

  <!-- 选项4：语音功能（待选） -->
  <rect x="20" y="420" width="360" height="70" class="option-group" stroke="#4a6cf7" stroke-width="2"/>
  <text x="35" y="440" class="section-title" fill="#4a6cf7">4. 需要语音交互吗？ ← 请选择</text>
  
  <rect x="30" y="450" width="100" height="30" class="option-btn"/>
  <text x="80" y="470" class="option-btn-text" text-anchor="middle">🎤 需要</text>
  
  <rect x="140" y="450" width="100" height="30" class="option-btn"/>
  <text x="190" y="470" class="option-btn-text" text-anchor="middle">不需要</text>
  
  <text x="350" y="470" class="small" fill="#f90">○</text>

  <!-- 选项5：错题本功能（待选） -->
  <rect x="20" y="500" width="360" height="70" class="option-group"/>
  <text x="35" y="520" class="section-title">5. 需要错题本功能吗？</text>
  
  <rect x="30" y="530" width="100" height="30" class="option-btn"/>
  <text x="80" y="550" class="option-btn-text" text-anchor="middle">📝 需要</text>
  
  <rect x="140" y="530" width="100" height="30" class="option-btn"/>
  <text x="190" y="550" class="option-btn-text" text-anchor="middle">暂不需要</text>
  
  <text x="350" y="550" class="small" fill="#999">○</text>

  <!-- 智能推荐提示 -->
  <rect x="20" y="585" width="360" height="45" fill="#fff8e1" stroke="#ffc107" rx="6"/>
  <text x="35" y="605" class="small" fill="#f57c00">💡 系统建议：基于你的选择，推荐添加"错题本"功能</text>
  <text x="35" y="622" class="hint" fill="#f57c00">点击上方选项快速采纳，或继续选择</text>

  <!-- 底部操作 -->
  <line x1="20" y1="700" x2="380" y2="700" class="divider"/>
  
  <rect x="20" y="715" width="120" height="40" class="button-secondary"/>
  <text x="80" y="740" class="button-secondary-text" text-anchor="middle">重新开始</text>
  
  <rect x="150" y="715" width="120" height="40" class="button-secondary"/>
  <text x="210" y="740" class="button-secondary-text" text-anchor="middle">使用默认值</text>
  
  <rect x="280" y="715" width="100" height="40" class="button"/>
  <text x="330" y="740" class="button-text" text-anchor="middle">确认 →</text>

  <!-- 中间：画布/预览面板 (500px) -->
  <rect x="400" y="60" width="500" height="730" class="panel" rx="8"/>
  
  <!-- 画布标题 -->
  <rect x="400" y="60" width="500" height="40" class="panel-header" rx="8"/>
  <text x="420" y="85" class="label" font-weight="bold">🎨 界面草图</text>
  <text x="700" y="85" class="small">实时预览 · 随选项更新</text>
  
  <!-- 工具栏 -->
  <rect x="830" y="68" width="24" height="24" class="button-secondary"/>
  <text x="842" y="85" class="small" text-anchor="middle">✏️</text>
  <rect x="860" y="68" width="24" height="24" class="button-secondary"/>
  <text x="872" y="85" class="small" text-anchor="middle">🔄</text>

  <!-- 画布区域 -->
  <rect x="420" y="115" width="460" height="580" class="canvas-bg" rx="4"/>
  
  <!-- 模拟的界面草图 - 手机App样式 -->
  <rect x="550" y="130" width="200" height="400" fill="#fff" stroke="#333" stroke-width="2" rx="20"/>
  
  <!-- 手机状态栏 -->
  <rect x="550" y="130" width="200" height="25" fill="#333" rx="20"/>
  <rect x="550" y="145" width="200" height="10" fill="#333"/>
  <text x="650" y="148" class="small" fill="#fff" text-anchor="middle">9:41</text>
  
  <!-- App标题栏 -->
  <rect x="560" y="165" width="180" height="35" fill="#4a6cf7"/>
  <text x="650" y="188" fill="#fff" font-size="14" text-anchor="middle">AI作业辅导</text>
  
  <!-- 拍照按钮区域 (因为选了"需要拍照") -->
  <rect x="580" y="215" width="140" height="80" class="sketch-element" rx="8"/>
  <circle cx="650" cy="245" r="20" class="sketch-element"/>
  <text x="650" y="250" class="small" text-anchor="middle">📷</text>
  <text x="650" y="285" class="small" text-anchor="middle">拍照识题</text>
  
  <!-- 题目显示区 -->
  <rect x="580" y="305" width="140" height="50" class="sketch-element" rx="4"/>
  <text x="650" y="335" class="small" text-anchor="middle">题目显示区</text>
  
  <!-- AI解答区 -->
  <rect x="580" y="365" width="140" height="70" class="sketch-element" rx="4"/>
  <text x="650" y="390" class="small" text-anchor="middle">AI解答区</text>
  <text x="590" y="410" class="hint">• 解题步骤</text>
  <text x="590" y="425" class="hint">• 知识点讲解</text>
  
  <!-- 底部导航（虚线表示待定） -->
  <rect x="560" y="445" width="180" height="40" fill="#f5f5f5"/>
  <rect x="580" y="455" width="35" height="25" fill="#e3f2fd" rx="4"/>
  <text x="597" y="472" class="small" text-anchor="middle">🏠</text>
  
  <!-- 语音按钮位置（虚线，因为还没选） -->
  <rect x="625" y="455" width="35" height="25" fill="none" stroke="#999" stroke-dasharray="3,2" rx="4"/>
  <text x="642" y="472" class="hint" text-anchor="middle">🎤?</text>
  
  <!-- 错题本位置（虚线，因为还没选） -->
  <rect x="670" y="455" width="35" height="25" fill="none" stroke="#999" stroke-dasharray="3,2" rx="4"/>
  <text x="687" y="472" class="hint" text-anchor="middle">📝?</text>
  
  <rect x="715" y="455" width="35" height="25" fill="#fff" stroke="#ddd" rx="4"/>
  <text x="732" y="472" class="small" text-anchor="middle">⚙️</text>

  <!-- 草图说明 -->
  <text x="650" y="540" class="hint" text-anchor="middle">— 草图随左侧选项实时更新 —</text>
  <text x="650" y="560" class="hint" text-anchor="middle">虚线框 = 待确认的功能</text>

  <!-- 科目标签 -->
  <rect x="440" y="600" width="200" height="60" fill="#f5f5f5" stroke="#e0e0e0" rx="6"/>
  <text x="455" y="620" class="small" font-weight="bold">已选科目：</text>
  <rect x="455" y="630" width="40" height="20" fill="#4a6cf7" rx="10"/>
  <text x="475" y="644" class="small" fill="#fff" text-anchor="middle">数学</text>
  <rect x="505" y="630" width="40" height="20" fill="#4a6cf7" rx="10"/>
  <text x="525" y="644" class="small" fill="#fff" text-anchor="middle">语文</text>

  <!-- 底部操作按钮 -->
  <rect x="570" y="710" width="100" height="36" class="button-secondary"/>
  <text x="620" y="733" class="button-secondary-text" text-anchor="middle">在导演台编辑</text>
  
  <rect x="690" y="710" width="140" height="36" class="button" opacity="0.5"/>
  <text x="760" y="733" class="button-text" text-anchor="middle" opacity="0.7">完成所有选项后可用</text>

  <!-- 右侧：节点导航面板 (280px) -->
  <rect x="910" y="60" width="280" height="730" class="panel" rx="8"/>
  
  <!-- 节点面板标题 -->
  <rect x="910" y="60" width="280" height="40" class="panel-header" rx="8"/>
  <text x="930" y="85" class="label" font-weight="bold">🌳 结构预览</text>
  <text x="1130" y="85" class="small">自动生成</text>

  <!-- 节点树（根据选项自动生成） -->
  <rect x="925" y="115" width="250" height="35" class="node-active"/>
  <text x="945" y="137" class="label">📁 AI作业辅导</text>
  <text x="1150" y="137" class="hint">项目</text>
  
  <rect x="940" y="160" width="235" height="30" class="node-item"/>
  <text x="960" y="180" class="small">📱 主界面</text>
  <text x="1150" y="180" class="hint">场景</text>
  
  <!-- 已确认的节点 -->
  <rect x="955" y="200" width="220" height="28" class="node-item" fill="#e8f5e9"/>
  <text x="975" y="218" class="small" fill="#2e7d32">✓ 拍照识题</text>
  
  <rect x="955" y="235" width="220" height="28" class="node-item" fill="#e8f5e9"/>
  <text x="975" y="253" class="small" fill="#2e7d32">✓ AI解答</text>
  
  <!-- 待确认的节点（虚线） -->
  <rect x="955" y="270" width="220" height="28" fill="none" stroke="#999" stroke-dasharray="3,2" rx="4"/>
  <text x="975" y="288" class="small" fill="#999">? 语音交互</text>
  <text x="1120" y="288" class="hint" fill="#f90">待选</text>
  
  <rect x="955" y="305" width="220" height="28" fill="none" stroke="#999" stroke-dasharray="3,2" rx="4"/>
  <text x="975" y="323" class="small" fill="#999">? 错题本</text>
  <text x="1120" y="323" class="hint" fill="#f90">待选</text>

  <!-- 分隔线 -->
  <line x1="925" y1="360" x2="1175" y2="360" class="divider"/>

  <!-- 选项进度 -->
  <text x="930" y="385" class="label" font-weight="bold">澄清进度</text>
  
  <!-- 进度条 -->
  <rect x="930" y="400" width="230" height="12" fill="#e0e0e0" rx="6"/>
  <rect x="930" y="400" width="138" height="12" fill="#4caf50" rx="6"/>
  <text x="1050" y="430" class="small" text-anchor="middle">3/5 已确认 (60%)</text>

  <!-- 已确认列表 -->
  <text x="930" y="460" class="small" fill="#4caf50">✓ 年级：小学</text>
  <text x="930" y="480" class="small" fill="#4caf50">✓ 科目：数学、语文</text>
  <text x="930" y="500" class="small" fill="#4caf50">✓ 拍照识题：需要</text>
  <text x="930" y="520" class="small" fill="#f90">○ 语音交互：待选择</text>
  <text x="930" y="540" class="small" fill="#999">○ 错题本：待选择</text>

  <!-- 快捷操作 -->
  <line x1="925" y1="570" x2="1175" y2="570" class="divider"/>
  <text x="930" y="595" class="label">快捷操作</text>
  
  <rect x="930" y="610" width="110" height="28" class="button-secondary"/>
  <text x="985" y="629" class="small" text-anchor="middle">全部默认</text>
  
  <rect x="1050" y="610" width="110" height="28" class="button-secondary"/>
  <text x="1105" y="629" class="small" text-anchor="middle">跳过可选项</text>

  <!-- 图例 -->
  <line x1="925" y1="680" x2="1175" y2="680" class="divider"/>
  <text x="930" y="705" class="hint">Loop A 构建流程</text>
  <text x="930" y="725" class="hint">第 2 步：点选澄清（系统提供智能默认）</text>
  <text x="930" y="745" class="hint">完成所有必选项后进入草图确认</text>
</svg>
