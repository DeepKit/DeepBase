<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <style>
      .title { font: bold 24px "Microsoft YaHei", sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px "Microsoft YaHei", sans-serif; fill: #666; }
      .label { font: bold 14px "Microsoft YaHei", sans-serif; fill: #333; }
      .small { font: 12px "Microsoft YaHei", sans-serif; fill: #666; }
      .tiny { font: 10px "Microsoft YaHei", sans-serif; fill: #999; }
      .layer-box { rx: 12; stroke-width: 2; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .flow-arrow { stroke: #4a6cf7; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
      .loop-line { stroke-dasharray: 6,3; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a6cf7"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="700" fill="#fafbfc"/>

  <!-- 标题 -->
  <text x="500" y="45" class="title" text-anchor="middle">如是（SoIs）系统架构</text>
  <text x="500" y="70" class="subtitle" text-anchor="middle">言出即是 · 修改准 · 维护稳</text>

  <!-- ===== 左侧：Loop A 构建循环 ===== -->
  <rect x="30" y="100" width="280" height="550" fill="#e3f2fd" stroke="#2196f3" class="layer-box" opacity="0.3"/>
  <text x="170" y="130" class="label" fill="#1976d2" text-anchor="middle">Loop A：构建循环</text>

  <!-- Loop A 步骤 -->
  <rect x="50" y="150" width="240" height="40" fill="#fff" stroke="#2196f3" rx="6"/>
  <text x="170" y="175" class="small" text-anchor="middle">1. 用户提出需求</text>

  <path d="M 170 190 L 170 205" class="flow-arrow"/>

  <rect x="50" y="210" width="240" height="40" fill="#fff" stroke="#2196f3" rx="6"/>
  <text x="170" y="235" class="small" text-anchor="middle">2. 系统澄清（智能默认）</text>

  <path d="M 170 250 L 170 265" class="flow-arrow"/>

  <rect x="50" y="270" width="240" height="40" fill="#fff" stroke="#2196f3" rx="6"/>
  <text x="170" y="295" class="small" text-anchor="middle">3. 画出界面草图</text>

  <path d="M 170 310 L 170 325" class="flow-arrow"/>

  <rect x="50" y="330" width="240" height="40" fill="#fff" stroke="#2196f3" rx="6"/>
  <text x="170" y="355" class="small" text-anchor="middle">4-6. 迭代修改（2-4循环）</text>

  <!-- 循环箭头 -->
  <path d="M 290 350 C 320 350, 320 290, 290 290" class="loop-line" stroke="#2196f3" marker-end="url(#arrowhead-blue)"/>

  <path d="M 170 370 L 170 385" class="flow-arrow"/>

  <rect x="50" y="390" width="240" height="40" fill="#fff" stroke="#2196f3" rx="6"/>
  <text x="170" y="415" class="small" text-anchor="middle">7. 导入到导演台</text>

  <path d="M 170 430 L 170 445" class="flow-arrow"/>

  <rect x="50" y="450" width="240" height="40" fill="#bbdefb" stroke="#1976d2" rx="6" stroke-width="2"/>
  <text x="170" y="475" class="label" fill="#1976d2" text-anchor="middle">8. 生成第一版程序 ✓</text>

  <!-- 产出 -->
  <text x="170" y="520" class="tiny" text-anchor="middle">产出：可运行的程序 + 完整节点树</text>

  <!-- ===== 中间：系统架构 ===== -->
  <rect x="340" y="100" width="320" height="550" fill="#fff" stroke="#e0e0e0" class="layer-box"/>
  <text x="500" y="130" class="label" text-anchor="middle">系统架构</text>

  <!-- 用户 -->
  <ellipse cx="500" cy="175" rx="60" ry="25" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="500" y="180" class="small" text-anchor="middle">👤 用户</text>

  <path d="M 500 200 L 500 230" class="arrow"/>

  <!-- 如是层 -->
  <rect x="370" y="235" width="260" height="100" fill="#e8eaf6" stroke="#5c6bc0" class="layer-box"/>
  <text x="500" y="265" class="label" fill="#3949ab" text-anchor="middle">如是（SoIs）</text>
  <text x="500" y="290" class="small" text-anchor="middle">对话交互 · 意图澄清 · 流程引导</text>
  <text x="500" y="310" class="tiny" text-anchor="middle">界面草图生成 · 问题定位 · 修改确认</text>

  <path d="M 500 335 L 500 365" class="arrow"/>
  <text x="510" y="355" class="tiny">调用</text>

  <!-- 述成层 -->
  <rect x="370" y="370" width="260" height="80" fill="#fff3e0" stroke="#ff9800" class="layer-box"/>
  <text x="500" y="400" class="label" fill="#f57c00" text-anchor="middle">述成（SayDone）</text>
  <text x="500" y="425" class="small" text-anchor="middle">自然语言 → 结构化数据</text>

  <path d="M 500 450 L 500 480" class="arrow"/>
  <text x="510" y="470" class="tiny">输出</text>

  <!-- 导演台层 -->
  <rect x="370" y="485" width="260" height="100" fill="#fce4ec" stroke="#e91e63" class="layer-box"/>
  <text x="500" y="515" class="label" fill="#c2185b" text-anchor="middle">导演台（DevDirector）</text>
  <text x="500" y="540" class="small" text-anchor="middle">场景树 · 节点定位 · 变更追踪</text>
  <text x="500" y="560" class="tiny" text-anchor="middle">代码生成 · 精确修改</text>

  <path d="M 500 585 L 500 615" class="arrow"/>

  <!-- 生成代码 -->
  <rect x="420" y="620" width="160" height="35" fill="#f5f5f5" stroke="#9e9e9e" rx="6"/>
  <text x="500" y="643" class="small" text-anchor="middle">📦 生成的程序</text>

  <!-- ===== 右侧：Loop B 维护循环 ===== -->
  <rect x="690" y="100" width="280" height="550" fill="#fff8e1" stroke="#ffc107" class="layer-box" opacity="0.3"/>
  <text x="830" y="130" class="label" fill="#f9a825" text-anchor="middle">Loop B：维护循环</text>

  <!-- Loop B 步骤 -->
  <rect x="710" y="150" width="240" height="40" fill="#fff" stroke="#ffc107" rx="6"/>
  <text x="830" y="175" class="small" text-anchor="middle">9. 用户运行，发现问题</text>

  <path d="M 830 190 L 830 205" class="arrow"/>

  <rect x="710" y="210" width="240" height="40" fill="#fff" stroke="#ffc107" rx="6"/>
  <text x="830" y="235" class="small" text-anchor="middle">10. 在导演台定位节点</text>

  <path d="M 830 250 L 830 265" class="arrow"/>

  <rect x="710" y="270" width="240" height="40" fill="#fff" stroke="#ffc107" rx="6"/>
  <text x="830" y="295" class="small" text-anchor="middle">11. 对话澄清修改意图</text>

  <path d="M 830 310 L 830 325" class="arrow"/>

  <rect x="710" y="330" width="240" height="40" fill="#fff" stroke="#ffc107" rx="6"/>
  <text x="830" y="355" class="small" text-anchor="middle">12. 生成修正版程序</text>

  <path d="M 830 370 L 830 385" class="arrow"/>

  <rect x="710" y="390" width="240" height="40" fill="#ffe082" stroke="#ffa000" rx="6" stroke-width="2"/>
  <text x="830" y="415" class="label" fill="#e65100" text-anchor="middle">13. 继续 9-12 循环</text>

  <!-- 循环箭头 -->
  <path d="M 950 405 C 980 405, 980 175, 950 175" class="loop-line" stroke="#ffc107" marker-end="url(#arrowhead)"/>

  <!-- 核心价值 -->
  <rect x="710" y="480" width="240" height="100" fill="#fff9c4" stroke="#f9a825" rx="8"/>
  <text x="830" y="510" class="label" fill="#f57f17" text-anchor="middle">核心价值</text>
  <text x="830" y="535" class="small" text-anchor="middle">🎯 修改准</text>
  <text x="830" y="555" class="small" text-anchor="middle">🔒 维护稳</text>

  <!-- 连接线：Loop A → 中间 → Loop B -->
  <path d="M 290 470 L 370 510" stroke="#2196f3" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 630 510 L 710 350" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- 节点粒度说明 -->
  <rect x="710" y="600" width="240" height="45" fill="#f5f5f5" stroke="#bdbdbd" rx="6"/>
  <text x="830" y="620" class="tiny" text-anchor="middle">节点粒度：</text>
  <text x="830" y="635" class="tiny" text-anchor="middle">项目 → 场景 → 步骤 → 功能点 → 代码块</text>
</svg>
