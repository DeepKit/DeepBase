  <text x="600" y="496" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.9)">Director / Orchestrator</text>
  <text x="600" y="512" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">运行时总指挥 · 无AI · 纯程序逻辑</text>

