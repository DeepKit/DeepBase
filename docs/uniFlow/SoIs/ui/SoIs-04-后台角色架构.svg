  <text x="120" y="242" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">如是专属角色 (SoIs Roles)</text>
  
  <!-- 澄清官 -->
  <rect x="120" y="255" width="110" height="60" rx="6" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="175" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">澄清官</text>
  <text x="175" y="293" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Clarifier</text>
  <text x="175" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#fef08a">🤖 需求分析·选项生成</text>
  
  <!-- 草图师 -->
  <rect x="250" y="255" width="110" height="60" rx="6" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="305" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">草图师</text>
  <text x="305" y="293" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Sketcher</text>
  <text x="305" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#fef08a">🤖 界面草图·实时更新</text>
  
  <!-- 定位员 -->
  <rect x="380" y="255" width="110" height="60" rx="6" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="435" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">定位员</text>
  <text x="435" y="293" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Locator</text>
  <text x="435" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#fef08a">🤖 问题定位·节点查找</text>
  
  <!-- 方案师 -->
  <rect x="510" y="255" width="110" height="60" rx="6" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="565" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">方案师</text>
  <text x="565" y="293" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Proposer</text>
  <text x="565" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#fef08a">🤖 修改建议·方案生成</text>
  
  <!-- 默认官 -->
  <rect x="640" y="255" width="110" height="60" rx="6" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="695" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">默认官</text>
  <text x="695" y="293" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Defaulter</text>
  <text x="695" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#bbf7d0">✓ 智能默认·规则推断</text>
  
  <!-- 进度官 -->
  <rect x="770" y="255" width="110" height="60" rx="6" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="825" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="white">进度官</text>
  <text x="825" y="293" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Tracker</text>
  <text x="825" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#bbf7d0">✓ 流程控制·状态跟踪</text>

  <!-- 如是角色AI标记汇总 -->
  <text x="900" y="300" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#6d28d9">🤖 需要AI: 澄清官、草图师、定位员、方案师</text>
  <text x="900" y="315" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#059669">✓ 纯程序: 默认官、进度官</text>

  <!-- 如是到述成的连线 -->
  <path d="M 600 325 L 600 355" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="345" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">调用</text>

