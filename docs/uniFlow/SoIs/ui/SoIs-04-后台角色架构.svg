  <text x="110" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">AI代理</text>
  <text x="110" y="666" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">AI Agent</text>
  <rect x="58" y="675" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="110" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">意图理解</text>
  <text x="110" y="703" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">内容生成</text>
  
  <!-- 共情官 -->
  <rect x="190" y="625" width="120" height="90" rx="8" fill="url(#capabilityGrad)" filter="url(#shadow)"/>
  <text x="250" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">共情官</text>
  <text x="250" y="666" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Empathy</text>
  <rect x="198" y="675" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="250" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">情感感知</text>
  <text x="250" y="703" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">体验优化</text>

  <!-- 记忆官 -->
  <rect x="120" y="730" width="120" height="90" rx="8" fill="url(#capabilityGrad)" filter="url(#shadow)"/>
  <text x="180" y="755" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">记忆官</text>
  <text x="180" y="771" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Memory</text>
  <rect x="128" y="780" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="180" y="795" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">上下文管理</text>
  <text x="180" y="808" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">历史记忆</text>

  <!-- 能力执行类AI标记 -->
  <text x="180" y="850" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#0891b2">🤖 全部需要AI</text>

