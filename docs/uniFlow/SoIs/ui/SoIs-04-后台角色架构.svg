<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="directorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <linearGradient id="soIsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="sayDoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="capabilityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48dbfb"/>
      <stop offset="100%" style="stop-color:#0abde3"/>
    </linearGradient>
    <linearGradient id="qualityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5f27cd"/>
      <stop offset="100%" style="stop-color:#341f97"/>
    </linearGradient>
    <linearGradient id="supportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#ff9f43"/>
    </linearGradient>
    <linearGradient id="devDirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a6cf7"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="950" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="600" y="35" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">如是（SoIs）/ 述成（SayDone）后台角色架构</text>
  <text x="600" y="58" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">AI归AI · 程序归程序 · 分层角色体系</text>

  <!-- ===== 顶层：用户 ===== -->
  <ellipse cx="600" cy="100" rx="70" ry="28" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="600" y="105" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="white">👤 用户</text>
  
  <!-- 用户到如是的连线 -->
  <path d="M 600 128 L 600 148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="143" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">自然语言</text>

  <!-- ===== 第一层：如是（对话层） ===== -->
  <rect x="320" y="155" width="560" height="55" rx="12" fill="url(#soIsGrad)" filter="url(#shadow)"/>
  <text x="600" y="180" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="white">如是 SoIs · 对话层</text>
  <text x="600" y="198" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">用户交互 · 点选澄清 · 草图生成 · 问题定位</text>

  <!-- ===== 如是专属角色 ===== -->
