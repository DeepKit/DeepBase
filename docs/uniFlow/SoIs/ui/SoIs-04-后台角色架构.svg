  <text x="520" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">守卫员</text>
  <text x="520" y="666" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Guardian</text>
  <rect x="468" y="675" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="520" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">格式验证</text>
  <text x="520" y="703" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">安全检查</text>
  
  <!-- 自检员 -->
  <rect x="600" y="625" width="120" height="90" rx="8" fill="url(#qualityGrad)" filter="url(#shadow)"/>
  <text x="660" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">自检员</text>
  <text x="660" y="666" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Self-Check</text>
  <rect x="608" y="675" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="660" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">AI输出自审</text>
  <text x="660" y="703" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">幻觉检测</text>

  <!-- 比对员 -->
  <rect x="530" y="730" width="120" height="90" rx="8" fill="url(#qualityGrad)" filter="url(#shadow)"/>
  <text x="590" y="755" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">比对员</text>
  <text x="590" y="771" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Diff Analyzer</text>
  <rect x="538" y="780" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="590" y="795" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">变更分析</text>
  <text x="590" y="808" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">影响评估</text>

  <!-- 质量守护类标记 -->
  <text x="520" y="850" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7c3aed">🔒 守卫员=硬关卡</text>
  <text x="660" y="850" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7c3aed">🤖 其他需要AI</text>

  <!-- ===== 保障类角色 ===== -->
  <!-- 回滚员 -->
  <rect x="940" y="625" width="120" height="90" rx="8" fill="url(#supportGrad)" filter="url(#shadow)"/>
  <text x="1000" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">回滚员</text>
  <text x="1000" y="666" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.9)">Rollback</text>
  <rect x="948" y="675" width="104" height="32" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="1000" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">故障恢复</text>
  <text x="1000" y="703" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">状态回滚</text>

  <!-- 保障类标记 -->
  <text x="1000" y="745" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ea580c">✓ 无需AI · 纯程序</text>

  <!-- ===== 汇报箭头到导演台 ===== -->
  <path d="M 180 820 L 180 880 L 600 880 L 600 900" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M 590 820 L 590 880" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M 1000 715 L 1000 880 L 600 880" stroke="#64748b" stroke-width="1.5" fill="none"/>
  
  <!-- 导演台 -->
  <rect x="420" y="895" width="360" height="30" rx="6" fill="url(#devDirGrad)" filter="url(#shadow)"/>
  <text x="600" y="915" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">导演台 DevDirector · 场景树 · 节点定位 · 代码生成</text>

  <!-- ===== 图例 ===== -->
  <rect x="50" y="895" width="320" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="70" y="915" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#334155">图例:</text>
  <text x="110" y="915" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#0891b2">🤖 需要AI</text>
  <text x="190" y="915" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#7c3aed">🔒 硬关卡</text>
  <text x="270" y="915" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#059669">✓ 纯程序</text>

  <!-- ===== 左侧原则说明 ===== -->
  <rect x="20" y="340" width="160" height="130" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="100" y="365" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155">设计原则</text>
  
  <line x1="30" y1="375" x2="170" y2="375" stroke="#e2e8f0"/>
  
  <text x="35" y="398" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">1. AI归AI</text>
  <text x="45" y="415" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#94a3b8">需要智能的用AI</text>
  
  <text x="35" y="438" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">2. 程序归程序</text>
  <text x="45" y="455" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#94a3b8">需要可靠的用程序</text>

  <!-- ===== 右侧如是角色说明 ===== -->
  <rect x="920" y="220" width="170" height="170" rx="8" fill="#fff" stroke="#a78bfa" filter="url(#shadow)"/>
