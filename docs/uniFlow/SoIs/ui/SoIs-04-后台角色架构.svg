  <!-- ===== 分支线到三类角色 ===== -->
  <path d="M 480 520 L 200 580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 520 L 600 580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 520 L 1000 580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="560" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">发号施令</text>

  <!-- ===== 三大类别标签 ===== -->
  <!-- 能力执行类 -->
  <rect x="50" y="585" width="300" height="28" rx="5" fill="#0891b2"/>
  <text x="200" y="604" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">能力执行类 Capability</text>
  
  <!-- 质量守护类 -->
  <rect x="450" y="585" width="300" height="28" rx="5" fill="#7c3aed"/>
  <text x="600" y="604" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">质量守护类 Quality</text>
  
  <!-- 保障类 -->
  <rect x="850" y="585" width="300" height="28" rx="5" fill="#ea580c"/>
  <text x="1000" y="604" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">保障类 Support</text>

  <!-- ===== 能力执行类角色 ===== -->
  <!-- AI代理 -->
