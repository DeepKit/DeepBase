<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .title { font: bold 20px "Microsoft YaHei", sans-serif; fill: #1a1a2e; }
      .subtitle { font: 14px "Microsoft YaHei", sans-serif; fill: #666; }
      .label { font: 12px "Microsoft YaHei", sans-serif; fill: #333; }
      .small { font: 10px "Microsoft YaHei", sans-serif; fill: #666; }
      .hint { font: italic 11px "Microsoft YaHei", sans-serif; fill: #999; }
      .panel { fill: #fff; stroke: #e0e0e0; stroke-width: 1; }
      .panel-header { fill: #f8f9fa; }
      .input-area { fill: #fafafa; stroke: #ddd; rx: 4; }
      .button { fill: #4a6cf7; rx: 4; }
      .button-text { font: bold 12px "Microsoft YaHei", sans-serif; fill: #fff; }
      .button-secondary { fill: #f0f0f0; stroke: #ccc; rx: 4; }
      .button-secondary-text { font: 12px "Microsoft YaHei", sans-serif; fill: #333; }
      .button-warning { fill: #ff9800; rx: 4; }
      .message-user { fill: #e3f2fd; rx: 8; }
      .message-ai { fill: #f5f5f5; rx: 8; }
      .node-item { fill: #fff; stroke: #ddd; rx: 4; }
      .node-problem { fill: #ffebee; stroke: #f44336; rx: 4; stroke-width: 2; }
      .node-related { fill: #fff3e0; stroke: #ff9800; rx: 4; }
      .code-block { fill: #1e1e1e; rx: 4; }
      .code-text { font: 11px "Consolas", monospace; fill: #d4d4d4; }
      .code-keyword { fill: #569cd6; }
      .code-string { fill: #ce9178; }
      .code-comment { fill: #6a9955; }
      .code-highlight { fill: #ffeb3b; fill-opacity: 0.3; }
      .divider { stroke: #e0e0e0; stroke-width: 1; }
      .badge-error { fill: #f44336; rx: 10; }
      .badge-text { font: bold 10px "Microsoft YaHei", sans-serif; fill: #fff; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="#f5f6fa"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1200" height="50" fill="#1a1a2e"/>
  <text x="20" y="32" class="title" fill="#fff">如是 SoIs</text>
  <text x="120" y="32" class="subtitle" fill="#aaa">— 言出即是</text>
  
  <!-- 项目名称 -->
  <text x="600" y="32" class="label" fill="#fff" text-anchor="middle">📁 AI辅导孩子作业 v1.2</text>
  
  <!-- 右上角状态 -->
  <text x="1080" y="32" class="small" fill="#ffa">● Loop B · 维护中</text>

  <!-- 左侧：对话面板 -->
  <rect x="10" y="60" width="380" height="730" class="panel" rx="8"/>
  
  <!-- 对话面板标题 -->
  <rect x="10" y="60" width="380" height="40" class="panel-header" rx="8"/>
  <text x="30" y="85" class="label" font-weight="bold">💬 问题反馈</text>
  <rect x="320" y="72" width="50" height="18" class="badge-error"/>
  <text x="345" y="85" class="badge-text" text-anchor="middle">1 问题</text>

  <!-- 对话历史 -->
  <!-- 用户反馈 -->
  <rect x="80" y="115" width="290" height="65" class="message-user"/>
  <text x="95" y="135" class="small">拍照识别有时候会把"6"识别成"9"</text>
  <text x="95" y="152" class="small">特别是手写的数字</text>
  <text x="95" y="169" class="small">孩子做数学题经常因为这个出错</text>

  <!-- AI分析 -->
  <rect x="20" y="190" width="320" height="100" class="message-ai"/>
  <text x="35" y="210" class="small" font-weight="bold">🔍 问题定位：</text>
  <text x="35" y="230" class="small">我找到了相关位置：</text>
  <text x="35" y="250" class="small">📍 主界面 → 拍照识题 → <tspan fill="#f44336">OCR处理</tspan></text>
  <text x="35" y="270" class="small">当前使用：基础OCR引擎</text>
  <text x="35" y="285" class="hint">→ 右侧已高亮问题节点</text>

  <!-- AI建议 -->
  <rect x="20" y="300" width="320" height="90" class="message-ai"/>
  <text x="35" y="320" class="small" font-weight="bold">💡 建议方案：</text>
  <text x="35" y="340" class="small">1. 增加数字预处理（旋转矫正）</text>
  <text x="35" y="357" class="small">2. 使用手写专用OCR模型</text>
  <text x="35" y="374" class="small">3. 添加识别结果确认步骤</text>
  <text x="35" y="388" class="hint">选择一个方案，或描述你想要的方式</text>

  <!-- 用户选择 -->
  <rect x="80" y="400" width="290" height="35" class="message-user"/>
  <text x="95" y="422" class="small">用方案2，然后让孩子可以修改识别结果</text>

  <!-- AI确认 -->
  <rect x="20" y="445" width="320" height="80" class="message-ai" stroke="#4caf50" stroke-width="2"/>
  <text x="35" y="465" class="small" font-weight="bold">✓ 明白了，修改方案：</text>
  <text x="35" y="485" class="small">1. OCR引擎 → 手写专用模型</text>
  <text x="35" y="502" class="small">2. 新增"结果确认"步骤</text>
  <text x="35" y="519" class="hint">点击"应用修改"生成新版本</text>

  <!-- 分隔线 -->
  <line x1="20" y1="700" x2="380" y2="700" class="divider"/>

  <!-- 输入区 -->
  <rect x="20" y="710" width="290" height="60" class="input-area"/>
  <text x="35" y="745" class="hint">描述其他问题，或调整修改方案...</text>
  
  <rect x="320" y="720" width="60" height="40" class="button"/>
  <text x="350" y="745" class="button-text" text-anchor="middle">发送</text>

  <!-- 中间：代码/差异预览面板 -->
  <rect x="400" y="60" width="500" height="730" class="panel" rx="8"/>
  
  <rect x="400" y="60" width="500" height="40" class="panel-header" rx="8"/>
  <text x="420" y="85" class="label" font-weight="bold">📝 修改预览</text>
  <text x="730" y="85" class="small">2 处变更</text>
  
  <!-- 切换标签 -->
  <rect x="810" y="68" width="40" height="24" fill="#4a6cf7" rx="4"/>
  <text x="830" y="85" class="small" fill="#fff" text-anchor="middle">差异</text>
  <rect x="855" y="68" width="40" height="24" class="button-secondary"/>
  <text x="875" y="85" class="small" text-anchor="middle">全部</text>

  <!-- 变更1：OCR引擎 -->
  <text x="420" y="125" class="label" font-weight="bold">变更 1：OCR引擎升级</text>
  <text x="420" y="142" class="hint">主界面 → 拍照识题 → OCR处理</text>
  
  <rect x="420" y="155" width="460" height="120" class="code-block"/>
  
  <!-- 删除的代码 -->
  <rect x="425" y="165" width="450" height="34" fill="#5c2626"/>
  <text x="435" y="182" class="code-text">- <tspan class="code-comment">// 基础OCR引擎</tspan></text>
  <text x="435" y="196" class="code-text">- OCREngine := TBasicOCR.Create;</text>
  
  <!-- 新增的代码 -->
  <rect x="425" y="205" width="450" height="60" fill="#264d26"/>
  <text x="435" y="222" class="code-text">+ <tspan class="code-comment">// 手写专用OCR引擎</tspan></text>
  <text x="435" y="238" class="code-text">+ OCREngine := THandwritingOCR.Create;</text>
  <text x="435" y="254" class="code-text">+ OCREngine.EnableRotationCorrection := <tspan class="code-keyword">True</tspan>;</text>

  <!-- 变更2：新增确认步骤 -->
  <text x="420" y="305" class="label" font-weight="bold">变更 2：新增结果确认步骤</text>
  <text x="420" y="322" class="hint">主界面 → 拍照识题 → [新] 结果确认</text>
  
  <rect x="420" y="335" width="460" height="180" class="code-block"/>
  
  <rect x="425" y="345" width="450" height="160" fill="#264d26"/>
  <text x="435" y="362" class="code-text">+ <tspan class="code-keyword">procedure</tspan> TMainForm.ShowConfirmDialog;</text>
  <text x="435" y="378" class="code-text">+ <tspan class="code-keyword">begin</tspan></text>
  <text x="435" y="394" class="code-text">+   ConfirmPanel.Visible := <tspan class="code-keyword">True</tspan>;</text>
  <text x="435" y="410" class="code-text">+   EditRecognized.Text := OCRResult;</text>
  <text x="435" y="426" class="code-text">+   <tspan class="code-comment">// 用户可编辑识别结果</tspan></text>
  <text x="435" y="442" class="code-text">+   EditRecognized.SetFocus;</text>
  <text x="435" y="458" class="code-text">+   BtnConfirm.OnClick := OnConfirmResult;</text>
  <text x="435" y="474" class="code-text">+   BtnRetake.OnClick := OnRetakePhoto;</text>
  <text x="435" y="490" class="code-text">+ <tspan class="code-keyword">end</tspan>;</text>

  <!-- 影响分析 -->
  <rect x="420" y="530" width="460" height="100" fill="#fff8e1" stroke="#ffc107" rx="4"/>
  <text x="435" y="555" class="label" font-weight="bold">⚠️ 影响分析</text>
  <text x="435" y="575" class="small">• 用户流程变化：拍照后需多一步确认</text>
  <text x="435" y="592" class="small">• 依赖新增：需要手写OCR库 (已内置)</text>
  <text x="435" y="609" class="small">• 向后兼容：✓ 不影响现有数据</text>

  <!-- 底部操作按钮 -->
  <rect x="450" y="710" width="100" height="36" class="button-secondary"/>
  <text x="500" y="733" class="button-secondary-text" text-anchor="middle">取消</text>
  
  <rect x="570" y="710" width="100" height="36" class="button-secondary"/>
  <text x="620" y="733" class="button-secondary-text" text-anchor="middle">调整方案</text>
  
  <rect x="690" y="710" width="140" height="36" class="button"/>
  <text x="760" y="733" class="button-text" text-anchor="middle">应用修改 ✓</text>

  <!-- 右侧：节点定位面板 -->
  <rect x="910" y="60" width="280" height="730" class="panel" rx="8"/>
  
  <rect x="910" y="60" width="280" height="40" class="panel-header" rx="8"/>
  <text x="930" y="85" class="label" font-weight="bold">🎯 问题定位</text>
  <text x="1140" y="85" class="small" fill="#f44336">已定位</text>

  <!-- 节点树 - 问题高亮 -->
  <rect x="925" y="115" width="250" height="30" class="node-item"/>
  <text x="945" y="135" class="label">📁 AI作业辅导</text>
  
  <rect x="940" y="155" width="235" height="28" class="node-related"/>
  <text x="960" y="173" class="small">📱 主界面</text>
  <text x="1145" y="173" class="hint" fill="#ff9800">相关</text>
  
  <rect x="955" y="193" width="220" height="28" class="node-related"/>
  <text x="975" y="211" class="small">📷 拍照识题</text>
  
  <!-- 问题节点 - 红色高亮 -->
  <rect x="970" y="228" width="205" height="28" class="node-problem"/>
  <text x="990" y="246" class="small" fill="#f44336" font-weight="bold">⚠ OCR处理</text>
  <text x="1145" y="246" class="hint" fill="#f44336">问题</text>
  
  <!-- 新增节点 -->
  <rect x="970" y="263" width="205" height="28" fill="#e8f5e9" stroke="#4caf50" stroke-dasharray="4,2" rx="4"/>
  <text x="990" y="281" class="small" fill="#4caf50">+ 结果确认</text>
  <text x="1145" y="281" class="hint" fill="#4caf50">新增</text>
  
  <rect x="955" y="300" width="220" height="28" class="node-item"/>
  <text x="975" y="318" class="small">🤖 AI解答</text>
  
  <rect x="955" y="335" width="220" height="28" class="node-item"/>
  <text x="975" y="353" class="small">📝 错题本</text>

  <!-- 分隔线 -->
  <line x1="925" y1="380" x2="1175" y2="380" class="divider"/>

  <!-- 问题节点详情 -->
  <text x="930" y="405" class="label" font-weight="bold" fill="#f44336">⚠ 问题节点：OCR处理</text>
  
  <text x="930" y="430" class="small">用户反馈：数字6/9识别错误</text>
  <text x="930" y="450" class="small">原因分析：基础OCR对手写不友好</text>
  <text x="930" y="470" class="small">影响范围：所有手写题目</text>
  
  <!-- 修改历史 -->
  <line x1="925" y1="495" x2="1175" y2="495" class="divider"/>
  <text x="930" y="520" class="label">修改历史</text>
  
  <text x="930" y="545" class="small" fill="#666">v1.2 (当前) - 待应用修改</text>
  <text x="930" y="562" class="small" fill="#999">v1.1 - 添加错题本功能</text>
  <text x="930" y="579" class="small" fill="#999">v1.0 - 首次发布</text>

  <!-- 快捷操作 -->
  <line x1="925" y1="600" x2="1175" y2="600" class="divider"/>
  <text x="930" y="625" class="label">快捷操作</text>
  
  <rect x="930" y="640" width="110" height="28" class="button-secondary"/>
  <text x="985" y="659" class="small" text-anchor="middle">查看代码</text>
  
  <rect x="1050" y="640" width="110" height="28" class="button-secondary"/>
  <text x="1105" y="659" class="small" text-anchor="middle">回滚版本</text>

  <!-- 图例 -->
  <line x1="925" y1="690" x2="1175" y2="690" class="divider"/>
  <text x="930" y="715" class="hint">Loop B 流程：发现问题 → 定位节点 → 确认修改 → 重新生成</text>
  <text x="930" y="735" class="hint">核心价值：修改准、维护稳</text>
  <text x="930" y="755" class="hint">精确定位问题，在正确的位置修改</text>
</svg>
