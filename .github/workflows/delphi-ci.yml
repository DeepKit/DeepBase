# UniBase Delphi Framework CI Pipeline
# Requires a Windows self-hosted runner with RAD Studio/Delphi 12 installed.
#
# Runner requirements:
#   - Label: delphi-windows
#   - Delphi path: C:\Program Files (x86)\Embarcadero\Studio\23.0
#   - FireDAC SQLite units installed
#   - sqlite3.dll available from Delphi bin, repo root, Tests, or a configured host path

name: Delphi CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      run_db_integration:
        description: 'Run DBEnv integration tests by setting UNIBASE_RUN_DB_INTEGRATION=1'
        required: false
        default: false
        type: boolean

env:
  DELPHI_VERSION: '23.0'
  DELPHI_PATH: 'C:\Program Files (x86)\Embarcadero\Studio\23.0'
  TEST_PLATFORM: Win64

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, delphi-windows]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Delphi environment
        run: |
          $compiler = Join-Path $env:DELPHI_PATH 'bin\dcc64.exe'
          if (-not (Test-Path $compiler)) {
            Write-Error "Delphi $env:DELPHI_VERSION Win64 compiler not found: $compiler"
            exit 1
          }
          Write-Host "Delphi Win64 compiler found: $compiler"

      - name: Run unit tests
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_tests.ps1 -Type Unit -CI -Platform $env:TEST_PLATFORM

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults\UnitTestResults.xml

  integration-tests:
    name: Integration Tests (DBEnv excluded)
    runs-on: [self-hosted, delphi-windows]
    needs: unit-tests

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests without DBEnv
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_tests.ps1 -Type Integration -CI -Platform $env:TEST_PLATFORM

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults\IntegrationTestResults.xml

  db-integration-tests:
    name: Integration Tests (DBEnv enabled)
    runs-on: [self-hosted, delphi-windows]
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_db_integration == true

    defaults:
      run:
        shell: powershell

    env:
      UNIBASE_RUN_DB_INTEGRATION: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DBEnv integration tests
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_tests.ps1 -Type Integration -CI -Platform $env:TEST_PLATFORM

      - name: Upload DB integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-integration-test-results
          path: TestResults\IntegrationTestResults.xml
