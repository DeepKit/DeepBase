# DeepBase Delphi Framework CI Pipeline
# Requires a Windows self-hosted runner with RAD Studio/Delphi 12 installed.
#
# Runner requirements:
#   - Label: delphi-windows
#   - Delphi path: D:\Program Files (x86)\Embarcadero\Studio\37.0
#   - FireDAC SQLite units installed
#   - sqlite3.dll available from Delphi bin, repo root, Tests, or a configured host path

name: Delphi CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      run_db_integration:
        description: 'Run DBEnv integration tests by setting DEEPBASE_RUN_DB_INTEGRATION=1'
        required: false
        default: false
        type: boolean

env:
  DELPHI_VERSION: '37.0'
  DELPHI_PATH: 'D:\Program Files (x86)\Embarcadero\Studio\37.0'
  TEST_PLATFORM: Win64

jobs:
  encoding-gate:
    name: Static Gates (source encoding + build ownership)
    runs-on: [self-hosted, delphi-windows]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .pas encoding baseline (G1/G2/G3)
        run: node .\09_工程脚本\encoding-gate\check_pas_encoding.js

      - name: Negative sample test (gate must fail on injected violations)
        run: node .\09_工程脚本\encoding-gate\test_negative_sample.js

      - name: Build ownership gate (no unregistered orphan units, new-track blockade)
        run: node .\09_工程脚本\build-ownership\check_build_ownership.js

      - name: Build ownership negative sample test
        run: node .\09_工程脚本\build-ownership\test_negative_sample.js

      - name: EOL consistency gate (WO-20260919-AUDIT-乙-R2 E9)
        run: node .\09_工程脚本\eol-gate\check_eol.js

      - name: EOL gate negative sample test
        run: node .\09_工程脚本\eol-gate\test_negative_sample.js

      - name: Managed-copy gate (no new Move/FillChar over managed types, WO-20260919-AUDIT-乙-R2 E7)
        run: node .\09_工程脚本\managed-copy-gate\check_managed_copy.js

      - name: Managed-copy gate negative sample test
        run: node .\09_工程脚本\managed-copy-gate\test_negative_sample.js

      - name: Evidence encoding gate (no NUL / non-UTF-8 audit evidence, WO-20260920-AUDIT-乙-R5 N3)
        run: node .\09_工程脚本\evidence-encoding-gate\check_evidence_encoding.js

      - name: Evidence encoding gate negative sample test
        run: node .\09_工程脚本\evidence-encoding-gate\test_negative_sample.js

      - name: Mojibake gate (丙类编码损坏：结构性吞 ASCII 只拦新增，WO-20260924-AUDIT-甲-D8)
        run: node .\09_工程脚本\mojibake-gate\check_mojibake.js

      - name: Mojibake gate negative sample test
        run: node .\09_工程脚本\mojibake-gate\test_negative_sample.js

      - name: Consumer contract gate (稳定单元存在且单份 + stable 公开签名不漂移，WO-20260924-AUDIT-甲-D9 段2)
        run: node .\09_工程脚本\contract-gate\check_contract.js

      - name: Consumer contract gate negative sample test
        run: node .\09_工程脚本\contract-gate\test_negative_sample.js

      - name: Compile-noise gate negative sample test (噪声解析/比对/跨面跳过与基线 fail-closed，WO-20260924-AUDIT-甲-D9 段4)
        run: node .\09_工程脚本\build-gate\test_noise.js

      - name: Build gate negative sample test (编译门禁输入面/真编译/判定不恒真反例全套，WO-20260926-AUDIT-甲-A7-01)
        run: node .\09_工程脚本\build-gate\test_negative_sample.js

  package-gate:
    name: Package Build Gate (Win64) - ${{ matrix.profile }}
    runs-on: [self-hosted, delphi-windows]
    needs: encoding-gate
    strategy:
      matrix:
        profile: [Minimal, Runtime, LLM, Speech, Commerce, Updater]
      fail-fast: false

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Delphi environment
        run: |
          $compiler = Join-Path $env:DELPHI_PATH 'bin\dcc64.exe'
          if (-not (Test-Path $compiler)) {
            Write-Error "Delphi $env:DELPHI_VERSION Win64 compiler not found: $compiler"
            exit 1
          }
          Write-Host "Delphi Win64 compiler found: $compiler"

      - name: Run package build gate
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\build_packages_win64.ps1 -Profile ${{ matrix.profile }}

  architecture-checks:
    name: Architecture Checks
    runs-on: [self-hosted, delphi-windows]
    needs: package-gate

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run architecture checks
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_architecture_checks.ps1 -Platform $env:TEST_PLATFORM

      - name: Upload architecture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-results
          path: TestResults\ArchitectureTestResults.xml

  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, delphi-windows]
    needs: architecture-checks

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Delphi environment
        run: |
          $compiler = Join-Path $env:DELPHI_PATH 'bin\dcc64.exe'
          if (-not (Test-Path $compiler)) {
            Write-Error "Delphi $env:DELPHI_VERSION Win64 compiler not found: $compiler"
            exit 1
          }
          Write-Host "Delphi Win64 compiler found: $compiler"

      - name: Run unit tests
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_tests.ps1 -Type Unit -CI -IncludeStubApis -IncludeEncoding -Platform $env:TEST_PLATFORM

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults\UnitTestResults.xml

  integration-tests:
    name: Integration Tests (DBEnv excluded)
    runs-on: [self-hosted, delphi-windows]
    needs: unit-tests

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests without DBEnv
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_tests.ps1 -Type Integration -CI -Platform $env:TEST_PLATFORM

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults\IntegrationTestResults.xml

  db-integration-tests:
    name: Integration Tests (DBEnv enabled)
    runs-on: [self-hosted, delphi-windows]
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_db_integration == true

    defaults:
      run:
        shell: powershell

    env:
      DEEPBASE_RUN_DB_INTEGRATION: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DBEnv integration tests
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\run_tests.ps1 -Type Integration -CI -Platform $env:TEST_PLATFORM

      - name: Upload DB integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-integration-test-results
          path: TestResults\IntegrationTestResults.xml

  examples-build:
    name: Examples Build Gate (Win64)
    runs-on: [self-hosted, delphi-windows]
    needs: integration-tests

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build required examples
        run: |
          powershell -ExecutionPolicy Bypass -File .\Scripts\build_examples_win64.ps1

      - name: Upload example build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-build-results
          path: |
            TestResults\ExampleBuildResults.txt
            TestResults\ExampleBuildResults.xml
